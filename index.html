<style>
/* Layout concept: a phone-first app column like the reference screens. White surfaces, hairline dividers, black and green pill buttons, a floating tab bar; on desktop the same column sits centered on a grey board. */
:root{
  --bg:#E9E9EB; --paper:#FFFFFF; --surface:#F8F8F9; --stage:#F2F2F4;
  --ink:#111111; --ink-2:#6E6E73; --ink-3:#A1A1A6; --line:#EDEDEF; --line-2:#DEDEE2;
  --green:#00A35C; --green-ink:#00824A; --green-tint:#EAF8F0; --blue:#1F7AE0;
  --red:#E5484D; --red-tint:#FDEEEF; --amber:#E8960C; --amber-tint:#FFF4E0;
  --btn:#111111; --on-btn:#FFFFFF; --btn-hov:#2C2C2E;
  --b-top:#EEEEF1; --b-side:#CBCBD1; --b-on-top:#1DB46E; --b-on-side:#08804A;
  --shadow-card:0 1px 2px rgba(17,17,17,.04),0 12px 32px -14px rgba(17,17,17,.16);
  --shadow-float:0 1px 2px rgba(17,17,17,.05),0 14px 34px -10px rgba(17,17,17,.22);
  /* tokens used by the drawn card art */
  --canvas:var(--stage); --sel:var(--green); --on-sel:#FFFFFF; --sel-lite:#7FE0B0; --spec:var(--blue); --focus:var(--blue);
  --good:var(--green); --bad:var(--red); --warn:#F0A01C; --info:var(--blue); --link:var(--blue);
  --m-fill:#F0F0F2; --m-sk:#E0E0E4; --img1:#D9E8FF; --img2:#EEF3D0; --img3:#D3F1E1; --img4:#FFE3CB;
  --av0:#CDEFD9; --av1:#FBD6E4; --av2:#D5E6FF; --av3:#FDE6C1; --av4:#E4DBFF; --av5:#CDEEF1; --av-ink:rgba(17,17,17,.55);
  --neu:#ECECEE; --neu-d:#CFCFD5; --neu-l:#FFFFFF;
  --r-card:18px;
  /* layout: the page already sits above the iPhone home bar (root padding), so the tab bar is
     8px above the home bar there and 32px from the screen edge on phones without one */
  --tb-b:max(8px,calc(32px - env(safe-area-inset-bottom,0px)));
  --tb-h:64px; --gap:24px; --card-max:520px;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --display:var(--body);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --paper:#141416; --surface:#1B1B1E; --stage:#1F1F23;
  --ink:#F2F2F3; --ink-2:#A1A1A9; --ink-3:#6B6B73; --line:#232327; --line-2:#323238;
  --green:#22C179; --green-ink:#4FD596; --green-tint:#10261B; --blue:#4C9BFF;
  --red:#FF6369; --red-tint:#2E1517; --amber:#FFB938; --amber-tint:#2D2312;
  --btn:#F2F2F3; --on-btn:#111111; --btn-hov:#D8D8DC;
  --b-top:#2B2B30; --b-side:#18181B; --b-on-top:#22C179; --b-on-side:#0B6B3D; --b-hl:.08;
  --shadow-card:0 1px 2px rgba(0,0,0,.4),0 14px 34px -14px rgba(0,0,0,.7);
  --shadow-float:0 1px 2px rgba(0,0,0,.4),0 16px 36px -10px rgba(0,0,0,.8);
  --on-sel:#08130D; --sel-lite:#7FE0B0; --warn:#FFB938;
  --m-fill:#26262B; --m-sk:#38383F; --img1:#23344F; --img2:#33391F; --img3:#1D3A2B; --img4:#43301F;
  --av0:#1F4632; --av1:#4A2433; --av2:#213A5C; --av3:#4A3714; --av4:#33295A; --av5:#1C4246; --av-ink:rgba(255,255,255,.75);
  --neu:#202024; --neu-d:#131316; --neu-l:#2D2D32;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --paper:#141416; --surface:#1B1B1E; --stage:#1F1F23;
  --ink:#F2F2F3; --ink-2:#A1A1A9; --ink-3:#6B6B73; --line:#232327; --line-2:#323238;
  --green:#22C179; --green-ink:#4FD596; --green-tint:#10261B; --blue:#4C9BFF;
  --red:#FF6369; --red-tint:#2E1517; --amber:#FFB938; --amber-tint:#2D2312;
  --btn:#F2F2F3; --on-btn:#111111; --btn-hov:#D8D8DC;
  --b-top:#2B2B30; --b-side:#18181B; --b-on-top:#22C179; --b-on-side:#0B6B3D; --b-hl:.08;
  --shadow-card:0 1px 2px rgba(0,0,0,.4),0 14px 34px -14px rgba(0,0,0,.7);
  --shadow-float:0 1px 2px rgba(0,0,0,.4),0 16px 36px -10px rgba(0,0,0,.8);
  --on-sel:#08130D; --sel-lite:#7FE0B0; --warn:#FFB938;
  --m-fill:#26262B; --m-sk:#38383F; --img1:#23344F; --img2:#33391F; --img3:#1D3A2B; --img4:#43301F;
  --av0:#1F4632; --av1:#4A2433; --av2:#213A5C; --av3:#4A3714; --av4:#33295A; --av5:#1C4246; --av-ink:rgba(255,255,255,.75);
  --neu:#202024; --neu-d:#131316; --neu-l:#2D2D32;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
button:disabled{cursor:default}
svg{flex:none}

/* ---------- app column ---------- */
.app{position:relative;height:100%;width:100%;display:flex;flex-direction:column;background:var(--paper);overflow:hidden;overflow:clip}
@media (min-width:640px) and (min-height:640px){
  body{background:var(--bg);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
  .app{width:420px;height:min(880px,100%);border-radius:36px;border:1px solid var(--line);box-shadow:0 40px 90px -40px rgba(0,0,0,.35)}
}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* ---------- header (like The Hub) ---------- */
.bar{display:flex;align-items:center;gap:10px;padding-top:14px;padding-bottom:12px;border-bottom:1px solid var(--line);flex:none;background:var(--paper)}
.mark{width:34px;height:34px;border-radius:10px;background:var(--green);display:grid;place-items:center;color:#fff;flex:none;position:relative;overflow:hidden}
.mark i{position:absolute;width:15px;height:19px;border-radius:4px;border:2px solid #fff;background:var(--green)}
.mark i:first-child{transform:translate(-3px,1px) rotate(-12deg);opacity:.7}
.mark i:last-child{transform:translate(3px,-1px) rotate(6deg);animation:markflip 6s infinite cubic-bezier(.3,1.4,.5,1)}
@keyframes markflip{0%,80%,100%{transform:translate(3px,-1px) rotate(6deg) scaleX(1)}88%{transform:translate(3px,-1px) rotate(6deg) scaleX(-1)}}
.bar h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.025em;white-space:nowrap;margin-right:auto}
.lvl{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 6px 0 8px;border:1px solid var(--line-2);border-radius:99px;font-size:14px;font-weight:500;background:var(--paper);box-shadow:0 1px 2px rgba(17,17,17,.04);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.lvl:active{transform:scale(.95)}
.lvl .bdg{width:20px;height:22px}
.lvl.bump{animation:bump .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.12)}}
.ring{width:22px;height:22px;transform:rotate(-90deg)}
.ring .t{fill:none;stroke:var(--line-2);stroke-width:3}
.ring .v{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.3,1.2,.5,1)}

/* ---------- main scroll area ---------- */
.main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:relative}
.view{min-height:100%;padding-bottom:calc(var(--tb-b) + var(--tb-h) + var(--gap));animation:viewin .45s cubic-bezier(.3,1.2,.5,1)}
@keyframes viewin{from{opacity:0;transform:translateY(10px)}}

/* section heading row (like "Customize your feed  Skip") */
.ctx{display:flex;flex-wrap:wrap;align-items:flex-start;gap:0 12px;padding-top:16px;padding-bottom:14px}
.ctx>div{flex:1;min-width:0}
.ctx h2{margin:0;font-size:17px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx p{margin:2px 0 0;font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.link{color:var(--blue);font-size:16px;font-weight:500;display:inline-flex;align-items:center;gap:6px;padding:2px 0;position:relative}
.link .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.big{margin:0;font-size:30px;font-weight:600;letter-spacing:-.03em;padding-top:22px;padding-bottom:16px}
.label{font-size:18px;color:var(--ink-2);font-weight:500;letter-spacing:-.01em;margin:28px 0 10px}

/* ---------- study ---------- */
/* Study = title row (hug) → card (fills the height, max 520) → buttons (hug), 24px apart.
   Once the card hits its max, the group is centred between the header and the tab bar. */
.v-study{display:flex;flex-direction:column;height:100%;min-height:520px}
.v-study>:first-child{margin-top:auto}.v-study>:last-child{margin-bottom:auto}
.stack{position:relative;flex:1 1 auto;min-height:300px;max-height:var(--card-max);margin:0 max(20px,env(safe-area-inset-right,0px)) var(--gap) max(20px,env(safe-area-inset-left,0px));touch-action:pan-y}
/* the next two cards peek out underneath in greys (inside the 24px gap) */
.ghost{position:absolute;border-radius:var(--r-card)}
.ghost.g1{inset:7px 10px -7px;background:var(--m-fill);border:1px solid var(--line-2)}
.ghost.g2{inset:14px 20px -14px;background:var(--line-2)}
.card{position:absolute;inset:0;perspective:1600px;cursor:grab;user-select:none;-webkit-user-select:none;outline:none;will-change:transform}
.card:active{cursor:grabbing}
.card.enter{animation:enter .55s cubic-bezier(.3,1.35,.5,1)}
@keyframes enter{from{transform:translateY(7px) scale(.97)}}
.card.first{animation:first .8s cubic-bezier(.3,1.4,.5,1)}
@keyframes first{from{transform:translateY(40px) rotate(-4deg);opacity:0}}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.3,1.35,.5,1)}
.card.flipped .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-card);box-shadow:var(--shadow-card);display:flex;flex-direction:column;padding:16px 18px 18px;overflow:hidden;transition:background .25s,border-color .25s}
.back{transform:rotateY(180deg)}
.card:focus-visible .face{box-shadow:0 0 0 3px var(--focus),var(--shadow-card)}
.card.ok .face{background:var(--green-tint);border-color:color-mix(in srgb,var(--green) 35%,transparent)}
.card.lt .face{background:var(--amber-tint);border-color:color-mix(in srgb,var(--amber) 35%,transparent)}
.cat{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px 0 9px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cat i{width:8px;height:8px;border-radius:3px;background:var(--c);flex:none}
.fmid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;min-height:0;padding-bottom:8px}
.fmid.sm{flex:none;padding:14px 2px 0;gap:4px}
.term{margin:0;font-size:clamp(30px,9vw,40px);line-height:1.06;font-weight:600;letter-spacing:-.035em;text-wrap:balance;overflow-wrap:anywhere}
.term.long{font-size:clamp(26px,7.4vw,33px)}
.ask{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em}
.fsub{margin:0;display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink-2)}
.fsub svg{color:var(--green)}
.rose{display:inline-block;vertical-align:.08em;margin-left:.22em;width:.62em;height:.62em;color:var(--green)}
.bterm .rose{width:18px;height:18px;vertical-align:-2px}
.stage{position:relative;flex:none;height:clamp(140px,44%,236px);margin-top:14px;border-radius:18px;background:var(--stage);overflow:hidden}
.stage>.vis{position:absolute;left:50%;top:50%;width:300px;height:186px;transform:translate(-50%,-50%) scale(var(--s,1))}
.def{margin:0;font-size:16px;line-height:1.5;color:var(--ink-2);overflow:auto;min-height:0;flex:1}
.dtag{position:absolute;top:18px;left:50%;z-index:6;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transform:translateX(-50%);box-shadow:var(--shadow-float);white-space:nowrap}
.dtag.know{background:var(--green);color:#fff}
.dtag.learn{background:var(--amber);color:#1b1200}
.acts{display:grid;grid-template-columns:52px 1fr 1fr;gap:10px;flex:none}
.circ{width:52px;height:52px;border-radius:50%;background:var(--m-fill);display:grid;place-items:center;color:var(--ink);transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s}
.circ:disabled{opacity:.35}
.circ:active:not(:disabled){transform:scale(.9)}
.pill{height:52px;border-radius:99px;font-size:16px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s,color .2s;padding:0 18px}
.pill:active{transform:scale(.96)}
.pill.out{background:var(--paper);border:1px solid var(--line-2);color:var(--ink)}
.pill.go{background:var(--green);color:#fff}
.pill.dark{background:var(--btn);color:var(--on-btn)}
.pill.dark:hover{background:var(--btn-hov)}
.pill.full{width:100%}
.pill.sm{height:44px;font-size:15px}
.pill .chk{display:none}
.pill.done .chk{display:block;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.pill.done span{display:none}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

/* deck bar: deck name (opens filters) + big position counter (Figma: Deck · 1 Front) */
.deckbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:20px;padding-bottom:var(--gap)}
.dk-l{min-width:0}
.dk-name{display:flex;align-items:center;gap:4px;max-width:100%;font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--ink);padding:2px 0}
.dk-name .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-name svg{flex:none;margin-top:2px}
.dk-name .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--green);margin-left:2px}
.dk-l p{margin:6px 0 0;font-size:13px;font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums}
.dk-count{flex:none;display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums}
.dk-count b{display:flex;align-items:center;gap:8px;font-size:40px;line-height:1.06;font-weight:600;letter-spacing:-.035em;overflow:hidden}
.dk-count b i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.dk-count b span{display:block}
.dk-count b .tick{animation:tick .45s cubic-bezier(.3,1.3,.5,1)}
@keyframes tick{from{transform:translateY(55%);opacity:0}}
.dk-count em{font-style:normal;font-size:14px;font-weight:500;color:var(--ink-2)}

/* deck card faces (Figma: Flashcard / Deck – Front, Deck – Back) */
.face.front.dk{padding:26px}
.face.back.dk{padding:20px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.face.back.dk::-webkit-scrollbar{display:none}
.face.back.dk .stage{flex:none}
.face.back.dk .def{overflow:visible;flex:none}
.clab{display:inline-flex;align-items:center;gap:8px;min-width:0;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clab i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c)}
.dk-top{display:flex;flex:none;min-width:0}
.dk-mid{flex:1;min-height:0;display:flex;align-items:center}
.term.hero{width:100%;font-size:clamp(34px,12.3vw,48px);line-height:1.04;letter-spacing:-.04em;overflow-wrap:normal}
.term.hero.long{font-size:clamp(28px,9.4vw,38px);line-height:1.08}
.dk-foot{flex:none;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:500;color:var(--ink-2);transition:opacity .3s}
.dk-foot .rv{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--green-tint);color:var(--green-ink)}
.stack:has(.hint:not(.out)) .dk-foot{opacity:0}
.face.dk .stage{margin-top:0}
.face.dk .fmid.sm{padding-top:18px}
.face.dk.front .stage{margin-top:16px}
.bterm{margin:20px 0 8px;font-size:24px;line-height:1.15;font-weight:600;letter-spacing:-.03em;text-wrap:balance}
.bmeta{display:flex;flex:none;margin-bottom:14px;min-width:0}

/* hint pill (like "Swipe to see settings") */
.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:9px;height:42px;padding:0 16px 0 7px;border-radius:99px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow-float);font-size:15px;white-space:nowrap;animation:hintin .6s .6s backwards cubic-bezier(.3,1.5,.5,1),hintbob 2.6s 1.2s infinite ease-in-out;transition:opacity .3s,transform .3s}
.hint b{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.hint b svg{animation:nudge 1.3s infinite ease-in-out}
.hint.out,.card.flipped~.hint{opacity:0;transform:translate(-50%,12px);pointer-events:none}
@keyframes hintin{from{opacity:0;transform:translate(-50%,16px)}}
@keyframes hintbob{50%{transform:translate(-50%,-4px)}}
@keyframes nudge{50%{transform:translateX(3px)}}

/* end and empty cards */
.endc{position:absolute;inset:0;background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-card);box-shadow:var(--shadow-card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px;animation:first .7s cubic-bezier(.3,1.4,.5,1)}
.endc h2{margin:0;font-size:26px;font-weight:600;letter-spacing:-.03em;text-wrap:balance}
.endc p{margin:0;color:var(--ink-2);max-width:30ch}
.endc .num{font-size:52px;font-weight:600;letter-spacing:-.04em;color:var(--green);line-height:1;font-variant-numeric:tabular-nums}
.endc .row{display:flex;flex-direction:column;gap:10px;width:100%;max-width:260px;margin-top:10px}

/* ---------- quiz ---------- */
.streak{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 5px;border-radius:99px;border:1px solid var(--line-2);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.streak b{width:24px;height:24px;border-radius:50%;background:var(--amber-tint);color:var(--amber);display:grid;place-items:center}
.streak.hot{animation:bump .6s cubic-bezier(.3,1.6,.5,1)}
.qcard{background:var(--paper);border:1px solid var(--line-2);border-radius:24px;box-shadow:var(--shadow-card);padding:12px 12px 16px;animation:first .6s cubic-bezier(.3,1.4,.5,1)}
.qcard .stage{height:clamp(140px,22vh,184px);margin-top:0}
.qcard h3{margin:14px 0 4px;font-size:19px;font-weight:600;letter-spacing:-.02em}
.qcard p.q{margin-top:14px}
.qcard p{margin:0 4px;font-size:16px;line-height:1.5;color:var(--ink-2)}
.qcard h3{margin-left:4px;margin-right:4px}
.qcard mark{background:var(--m-fill);color:transparent;border-radius:6px;padding:0 1.4em;position:relative}
.qcard mark::after{content:"";position:absolute;left:50%;top:50%;width:1.6em;height:4px;transform:translate(-50%,-50%);background:radial-gradient(circle,var(--ink-3) 1.6px,transparent 2px) 0 0/8px 4px repeat-x}
.qcard.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.opts{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;display:flex;align-items:center;width:100%;min-height:68px;padding:12px 30px 12px 14px;text-align:left;font-size:15px;font-weight:500;line-height:1.25;border:1px solid var(--line-2);border-radius:18px;background:var(--paper);transition:background .25s,opacity .25s,border-color .25s,transform .25s cubic-bezier(.3,1.6,.5,1);animation:optin .4s backwards cubic-bezier(.3,1.3,.5,1);overflow-wrap:anywhere}
.opt:active:not(:disabled){transform:scale(.97)}
.opt:nth-child(2){animation-delay:.04s}.opt:nth-child(3){animation-delay:.08s}.opt:nth-child(4){animation-delay:.12s}
@keyframes optin{from{opacity:0;transform:translateY(8px)}}
.opt:hover:not(:disabled){background:var(--surface)}
.opt .k{position:absolute;top:9px;right:9px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink-3);transition:background .25s,color .25s}
.opt .t{flex:1;min-width:0}
.opt.right{background:var(--green-tint);border-color:var(--green)}
.opt.right .k{background:var(--green);color:#fff;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.opt.wrong{background:var(--red-tint);border-color:var(--red)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt.dim{opacity:.45}
.qnext{margin-top:12px;animation:optin .4s cubic-bezier(.3,1.3,.5,1)}
.verdict{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:15px;font-weight:500}
.opt .k:empty{display:none}
.verdict.ok{color:var(--green-ink)}.verdict.no{color:var(--red)}

/* ---------- browse ---------- */
.field{display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;border-radius:99px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink-3);transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 16%,transparent)}
.field input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font:inherit;font-size:16px;color:var(--ink)}
.field input::placeholder{color:var(--ink-3)}
.field input::-webkit-search-cancel-button{display:none}
.field .clr{width:26px;height:26px;border-radius:50%;background:var(--m-fill);display:grid;place-items:center;color:var(--ink-2)}
.chips{display:flex;gap:8px;overflow-x:auto;scroll-padding-inline:20px;padding-top:14px;padding-bottom:6px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--paper);font-size:14px;font-weight:500;white-space:nowrap;scroll-snap-align:start;transition:background .2s,color .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.chip:active{transform:scale(.95)}
.chip i{width:8px;height:8px;border-radius:3px;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.count{font-size:14px;color:var(--ink-3);padding-top:8px;padding-bottom:4px;font-variant-numeric:tabular-nums}
.rows{list-style:none;margin:0;padding:0}
.rows li{content-visibility:auto;contain-intrinsic-size:auto 89px}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;text-align:left;padding-top:12px;padding-bottom:12px;border-bottom:1px solid var(--line);transition:background .2s}
.row:active{background:var(--surface)}
.thumb{position:relative;width:96px;height:64px;border-radius:12px;background:var(--stage);overflow:hidden;border:1px solid var(--line)}
.thumb>.vis{position:absolute;left:50%;top:50%;width:300px;height:186px;transform:translate(-50%,-50%) scale(.36);pointer-events:none}
.row b{display:block;font-size:16px;font-weight:500;letter-spacing:-.01em;line-height:1.25}
.row small{display:block;font-size:14px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .st{color:var(--ink-3);display:grid;place-items:center}
.row .st .rose{width:20px;height:20px;margin:0}
.empty{text-align:center;padding:48px 10px;color:var(--ink-2)}
.empty h3{margin:0 0 4px;font-size:18px;color:var(--ink);font-weight:600}

/* ---------- progress (like My profile) ---------- */
.pcard{background:var(--surface);border:1px solid var(--line-2);border-radius:22px;padding:18px}
.pcard .bdg{width:46px;height:50px}
.pname{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:21px;font-weight:500;letter-spacing:-.02em}
.tagp{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;background:var(--green);color:#fff;font-size:13px;font-weight:600;letter-spacing:0}
.lchip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 7px 0 12px;margin-top:12px;border-radius:99px;background:var(--paper);border:1px solid var(--line-2);font-size:15px;font-weight:500;box-shadow:0 2px 6px rgba(17,17,17,.05)}
.lchip .bdg{width:22px;height:24px}
.lchip .ring{width:26px;height:26px}
.xprow{display:flex;justify-content:space-between;margin-top:14px;font-size:16px;font-variant-numeric:tabular-nums}
.xprow span:last-child{color:var(--green-ink);font-weight:500}
.badges{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px 12px 6px;border-radius:20px;border:1px solid transparent}
.brow.next{background:var(--surface);border-color:var(--line-2)}
.brow .bdg{width:66px;height:72px;justify-self:center}
.brow b{display:block;font-size:16px;font-weight:500}
.brow p{margin:3px 0 0;font-size:15px;line-height:1.45;color:var(--ink-2)}
.bbar{height:7px;border-radius:4px;border:1px solid var(--line-2);background:var(--paper);margin-top:12px;overflow:hidden}
.bbar i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .8s cubic-bezier(.3,1.2,.5,1)}
.brow small{display:block;margin-top:8px;font-size:13px;color:var(--ink-2)}
.brow.on .bdg{animation:float 3s infinite ease-in-out}
@keyframes float{50%{transform:translateY(-3px)}}
.bdg .bt{fill:var(--b-top);stroke:var(--b-top)}
.bdg .bs{fill:var(--b-side);stroke:var(--b-side)}
.bdg.on .bt{fill:var(--b-on-top);stroke:var(--b-on-top)}
.bdg.on .bs{fill:var(--b-on-side);stroke:var(--b-on-side)}
.bdg .hl{fill:#fff;opacity:.28}
.bdg.off .hl{opacity:var(--b-hl,.5)}
.list{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;min-height:62px;text-align:left;padding:6px 0}
.lrow .ico{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;background:var(--paper)}
.lrow .ico i{width:12px;height:12px;border-radius:4px;background:var(--c)}
.lrow b{font-size:16px;font-weight:500;display:block}
.lrow small{display:block;font-size:14px;color:var(--ink-2);margin-top:1px}
.lrow .mini{width:72px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-left:auto}
.lrow .mini i{display:block;height:100%;background:var(--c)}
.lrow .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.lrow.danger b{color:var(--red)}
.lrow.danger .ico{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line-2);border-radius:20px;overflow:hidden}
.stats div{padding:14px 12px;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0}
.stats small{display:block;font-size:13px;color:var(--ink-2)}
.stats b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.confirm{display:flex;gap:10px;margin:4px 0 6px;animation:optin .35s cubic-bezier(.3,1.3,.5,1)}
.confirm .pill{flex:1}
.pill.red{background:var(--red);color:#fff}

/* ---------- floating tab bar ---------- */
.tabbar{position:absolute;left:50%;bottom:var(--tb-b);transform:translateX(-50%);z-index:20;display:flex;gap:2px;padding:6px;background:var(--paper);border:1px solid var(--line);border-radius:99px;box-shadow:var(--shadow-float)}
.tab{position:relative;display:flex;align-items:center;gap:0;height:50px;min-width:54px;padding:0 15px;border-radius:99px;color:var(--ink-3);transition:background .35s cubic-bezier(.3,1.3,.5,1),color .25s,gap .35s,padding .35s}
.tab span{max-width:0;overflow:hidden;white-space:nowrap;font-size:15px;font-weight:500;opacity:0;transition:max-width .4s cubic-bezier(.3,1.2,.5,1),opacity .25s}
.tab[aria-selected="true"]{background:var(--m-fill);color:var(--ink);gap:7px;padding:0 16px 0 14px}
.tab[aria-selected="true"] span{max-width:90px;opacity:1}
.tab .pip{position:absolute;top:10px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--paper)}
.tab:active{transform:scale(.94)}

/* ---------- bottom sheet ---------- */
.scrim{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.36);opacity:0;transition:opacity .3s}
.scrim.on{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;max-height:88%;display:flex;flex-direction:column;background:var(--paper);border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .45s cubic-bezier(.3,1.15,.5,1)}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line-2);margin:9px auto 4px;flex:none}
.sheet .sbody{overflow-y:auto;overscroll-behavior:contain;padding-top:6px;padding-bottom:24px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 4px}
.shead h3{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em}
.slabel{font-size:15px;color:var(--ink-2);margin:20px 0 8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;border-radius:14px;background:var(--m-fill)}
.seg button{height:40px;border-radius:11px;font-size:14px;font-weight:500;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;transition:background .25s,color .2s}
.seg button small{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.box{border:1px solid var(--line-2);border-radius:18px;overflow:hidden}
.crow{display:grid;grid-template-columns:30px minmax(0,1fr) auto 22px;gap:12px;align-items:center;width:100%;min-height:52px;padding:0 14px;text-align:left;border-top:1px solid var(--line);font-size:16px}
.crow:first-child{border-top:0}
.crow .sq{width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--c) 15%,transparent);display:grid;place-items:center}
.crow .sq i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.crow small{font-size:14px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.crow .ck{color:var(--green);opacity:0;transform:scale(.4);transition:opacity .2s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.crow[aria-pressed="true"] .ck{opacity:1;transform:none}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:54px;padding:0 14px;border-top:1px solid var(--line);text-align:left;font-size:16px}
.trow:first-child{border-top:0}
.sw{width:50px;height:30px;border-radius:15px;background:var(--m-sk);position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.trow[aria-checked="true"] .sw,.lrow[aria-checked="true"] .sw{background:var(--green)}
.trow[aria-checked="true"] .sw::after,.lrow[aria-checked="true"] .sw::after{transform:translateX(20px)}
.detail .stage{height:200px}
.detail h2{margin:16px 0 6px;font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.detail p{margin:0;font-size:16px;line-height:1.5;color:var(--ink-2)}
.detail .acts2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}

/* ---------- badge unlocked ---------- */
.unlock{position:absolute;inset:0;z-index:40;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.4);animation:fade .3s}
@keyframes fade{from{opacity:0}}
.unlock .box2{width:100%;max-width:320px;background:var(--paper);border-radius:28px;padding:26px 22px 20px;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);animation:first .7s cubic-bezier(.3,1.5,.5,1)}
.unlock .bdg{width:96px;height:104px;animation:spinin 1s cubic-bezier(.3,1.4,.5,1)}
@keyframes spinin{from{transform:scale(.2) rotate(-40deg);opacity:0}}
.unlock small{display:block;font-size:14px;color:var(--green-ink);font-weight:600;margin-top:10px}
.unlock h3{margin:4px 0 6px;font-size:24px;font-weight:600;letter-spacing:-.03em}
.unlock p{margin:0 0 18px;color:var(--ink-2)}

/* ---------- toast + confetti ---------- */
.toast{position:absolute;left:50%;bottom:calc(var(--tb-b) + var(--tb-h) + 14px);z-index:35;transform:translate(-50%,24px);opacity:0;visibility:hidden;background:var(--btn);color:var(--on-btn);height:44px;padding:0 18px;border-radius:99px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;white-space:nowrap;box-shadow:var(--shadow-float);transition:transform .45s cubic-bezier(.3,1.5,.5,1),opacity .3s,visibility .3s}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}
.toast.with-icon{padding-left:7px}
.toast b{width:30px;height:30px;border-radius:50%;background:var(--amber);color:#1b1200;display:grid;place-items:center;flex:none}
.toast b svg{animation:spinback .8s .25s cubic-bezier(.3,1.4,.5,1)}
@keyframes spinback{from{transform:rotate(-200deg)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.sr{position:absolute;top:0;left:0;margin:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:370px){
  .bar h1{font-size:20px}
  .lvl span{display:none}
  .pill{font-size:15px;padding:0 12px}
  .acts{grid-template-columns:48px 1fr 1fr;gap:8px}
  .circ{width:48px;height:48px}
  .dk-name{font-size:20px}
  .dk-count b{font-size:34px}
}
@media (max-height:720px){
  .stage{height:clamp(120px,40%,220px)}
  .deckbar{padding-top:14px}
}
@media (max-height:640px){
  .v-study{min-height:470px}
  .ctx{padding-top:10px;padding-bottom:10px}
  .deckbar{padding-top:10px}
  .stack{min-height:276px}
  .dk-count b{font-size:32px}
  .face.front.dk{padding:20px}
  .pill,.circ{height:48px}
  .circ{width:48px}
}

/* in a phone browser (not installed), the browser's own toolbar sits below the page: hug it */
@media (display-mode:browser) and (hover:none){:root{--tb-b:8px}}

/* desktop: "best on your phone" panel beside the phone column */
.desk{display:none}
@media (min-width:960px) and (min-height:640px){
  body{gap:64px}
  .desk{display:flex;flex-direction:column;align-items:flex-start;width:300px;color:var(--ink)}
  .desk h2{margin:18px 0 8px;font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
  .desk p{margin:0;color:var(--ink-2);font-size:16px;line-height:1.5}
  .desk .qr{margin-top:22px;padding:14px;background:#fff;border-radius:20px;border:1px solid var(--line-2);box-shadow:var(--shadow-card)}
  .desk .qr svg{display:block;width:148px;height:148px}
  .desk h3{margin:30px 0 10px;font-size:13px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
  .keys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:15px}
  .keys li{display:flex;align-items:center;gap:6px}
  .keys kbd{min-width:30px;height:28px;padding:0 8px;display:inline-grid;place-items:center;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:8px;background:var(--paper);font:500 13px var(--body);margin-right:6px}
}

/* feedback sheet */
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rate button{height:56px;border-radius:16px;border:1px solid var(--line-2);background:var(--paper);font-size:28px;line-height:1;filter:grayscale(.85);opacity:.75;transition:transform .25s cubic-bezier(.3,1.6,.5,1),filter .2s,opacity .2s,border-color .2s,background .2s}
.rate button[aria-pressed="true"]{filter:none;opacity:1;border-color:var(--green);background:var(--green-tint);transform:scale(1.06)}
.fb{width:100%;border:1px solid var(--line-2);border-radius:16px;background:var(--surface);padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);resize:vertical;outline:none;transition:border-color .2s,box-shadow .2s}
.fb:focus{border-color:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 16%,transparent)}
.fb::placeholder{color:var(--ink-3)}
input.fb{height:50px;border-radius:99px;padding:0 18px}
.slabel small{color:var(--ink-3);font-size:13px}
.fbsend{margin-top:20px}
.fbsend:disabled{opacity:.6}
.privacy{margin:18px 0 0;font-size:13px;line-height:1.5;color:var(--ink-3)}

/* home dashboard */
.v-home .big{padding-bottom:14px}
.tico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.dhero{border:1px solid var(--line-2);border-radius:22px;padding:16px;background:var(--paper);box-shadow:var(--shadow-card)}
.hrow{display:flex;align-items:center;gap:12px}
.hl{flex:1;min-width:0}.hl small{display:block;font-size:13px;color:var(--ink-2);font-weight:500}.hl b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hn{text-align:right;font-variant-numeric:tabular-nums}.hn b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em}.hn small{font-size:13px;color:var(--ink-2)}
.tbar{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.tbar i{display:block;height:100%;border-radius:3px;background:var(--c);min-width:0;transition:width .6s cubic-bezier(.3,1.2,.5,1)}
.tbar.lg{height:8px;margin:16px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border:1px solid var(--line-2);border-radius:20px;background:var(--paper);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.tile:active{transform:scale(.97)}
.tile .tico{margin-bottom:10px}
.tile b{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.tile small{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tile .tbar{width:100%;margin-top:auto;height:5px}
.tile small{margin-bottom:10px}
.pcard.lv{display:flex;align-items:center;gap:14px;margin-top:10px;padding:14px 16px}
.pcard.lv>div{flex:1;min-width:0}.pcard.lv .pname{margin-top:0;font-size:17px}.pcard.lv .xprow{margin:4px 0 10px;font-size:13px;color:var(--ink-2)}.pcard.lv .xprow span:last-child{font-weight:500}
.aiwarn{margin:8px 0 0;font-size:11.5px;line-height:1.45;color:var(--ink-3)}
/* interview (question) cards */
.term.hero.qtn{font-size:clamp(26px,8.2vw,32px);line-height:1.12;letter-spacing:-.03em}
.bterm.qb{margin:10px 0 12px;font-size:20px;line-height:1.25}
.def.ans p{margin:0 0 12px}.def.ans ul{margin:0 0 12px;padding-left:20px}.def.ans li{margin:0 0 6px}
.detail p+p{margin-top:10px}.detail ul{color:var(--ink-2);padding-left:20px;margin:10px 0 0}.detail li{margin-bottom:6px}
.thumb .tq{position:absolute;inset:0;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--stage))}
.endq{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:56px}
.endq .tico{width:60px;height:60px;border-radius:18px}
.endq h2{margin:8px 0 0;font-size:24px;font-weight:600;letter-spacing:-.03em;text-wrap:balance}
.endq p{margin:0;color:var(--ink-2);max-width:32ch}
.endq .row{display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px;margin-top:12px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ===== Mini UI kit (drawn inside the card's visual stage) ===== */
.vis{position:relative;display:flex;align-items:center;justify-content:center;font-family:var(--body);font-size:11px;line-height:1.25;color:var(--ink-2);overflow:hidden;text-align:left}
.vis *{box-sizing:border-box}
.vis i,.vis em{font-style:normal}
.mtx .ic{display:inline-block;vertical-align:-2px}
.still *, .still *::before, .still *::after{animation-play-state:paused!important}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ic .f,.ic g.f *{fill:currentColor;stroke:none}
.mrow{display:flex;align-items:center;flex:none}
.mcol{display:flex;flex-direction:column;align-items:flex-start;flex:none}
.mabs{position:absolute}
.mrel{position:relative;flex:none}
.msp{flex:1 1 auto;display:block;min-width:4px}
.mdiv{display:block;height:1px;width:100%;background:var(--line)}
.mdiv.hl{height:2px;background:var(--spec)}
.mtx{color:var(--ink);font-size:11px;font-weight:500;white-space:nowrap}
.mtx.lbl{font-weight:650;font-size:10.5px}
.mtx.big{font-size:12.5px;font-weight:700}
.mtx.help{color:var(--ink-3);font-size:9.5px;font-weight:500}
.mtx.err{color:var(--bad);font-size:9.5px;font-weight:600}
.mtx.tiny{font-size:8.5px;color:var(--ink-2)}
.mtx.b{font-weight:700}
.mtx.c{text-align:center;white-space:normal;line-height:1.3}
.mtx.num{font-family:var(--body);font-size:24px;font-weight:700;letter-spacing:-.02em}
.mtx.num.md{font-size:17px}
.mtx.num-sm{font-family:var(--body);font-variant-numeric:tabular-nums;font-size:10.5px;font-weight:600}
.mtx.num-xs{font-family:var(--body);font-variant-numeric:tabular-nums;font-size:9px;color:var(--ink-3);width:10px}
.mtx.mono{font-family:var(--body);font-variant-numeric:tabular-nums;font-size:9.5px;color:var(--ink-2)}
.mtx.code{background:var(--m-fill);padding:3px 6px;border-radius:4px;color:var(--ink)}
.mtx.lnk{color:var(--sel)}
.mtx.ok,.mtx.ok2{color:var(--good)}
.mtx.ok2{display:inline-flex;align-items:center;gap:3px;font-weight:600}
.mtx.ok2 .ic{display:inline-block}
.mtx.help.ok2{font-size:9.5px}
.mtx.bad2{color:var(--bad)}
.mtx.fc{color:var(--ink-3)} .mtx.fc.ok{color:var(--good)}
.mtx.strike{text-decoration:line-through;color:var(--ink-3)}
.mtx.u{text-decoration:underline}
.mtx.huge{font-family:var(--body);font-size:34px;font-weight:700;letter-spacing:-.03em}
.mtx.hard{font-size:13px;letter-spacing:.04em;color:var(--ink-3)}
.mtx.mono.big{font-size:14px;color:var(--ink);font-weight:600}
.mtx.w140{white-space:normal;width:140px;line-height:1.35;font-size:10px}
.mtx.ab{font-family:var(--body);font-weight:800;font-size:14px;color:var(--sel)}
.mtx.trunc{max-width:140px;overflow:hidden;text-overflow:ellipsis}
.mtx.fr{color:var(--sel);font-size:9px}
.mtx.flatword{font-weight:600;color:var(--ink);padding:5px 0}
.mtx.ty1{font-family:var(--body);font-size:34px;font-weight:800}
.mtx.ty2{font-family:Georgia,'Times New Roman',serif;font-size:34px;font-weight:400}
.mtx.ty3{font-family:var(--body);font-variant-numeric:tabular-nums;font-size:30px;font-weight:500}
.mtx.trk0{font-weight:700;letter-spacing:-.06em;font-size:14px}
.mtx.trk1{font-weight:700;letter-spacing:.06em;font-size:14px}
.mtx.trk2{font-weight:700;font-size:14px;letter-spacing:.02em}
.mtx.vh1,.mtx.vh2,.mtx.vh3{font-family:var(--body);font-variant-numeric:tabular-nums;font-size:8px;color:#fff;background:var(--spec);border-radius:50%;width:13px;height:13px;display:grid;place-items:center;margin-bottom:-2px}
.mcaret{display:inline-block;width:1.5px;height:12px;background:var(--sel);margin-left:1px;animation:blink 1s steps(1) infinite;vertical-align:middle}
@keyframes blink{50%{opacity:0}}

/* buttons */
.mb{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:28px;padding:0 13px;border-radius:8px;font-weight:550;font-size:11px;white-space:nowrap;flex:none;background:var(--btn);color:var(--on-btn);transition:transform .2s}
.mb.s{background:var(--paper);border:1px solid var(--line-2);color:var(--ink)}
.mb.g{background:transparent;color:var(--link);padding:0 8px}
.mb.ac{background:var(--green);color:#fff}
.mb.d{background:var(--bad);color:#fff}
.mb.ok{background:var(--good);color:#fff}
.mb.dis{background:var(--m-fill);color:var(--ink-3)}
.mb.ic{width:30px;height:30px;padding:0;border-radius:50%;background:var(--m-fill);color:var(--ink)}
.mb.ic.big{width:40px;height:40px}
.mb.ic.pri{background:var(--btn);color:var(--on-btn);width:24px;height:24px}
.mb.fab{width:32px;height:32px;padding:0;border-radius:50%;background:var(--green);color:#fff;box-shadow:0 4px 10px color-mix(in srgb,var(--green) 40%,transparent)}
.mb.fab.ring{box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--warn)}
.mb.sq{width:28px;padding:0}
.mb.sm{height:20px;font-size:9px;padding:0 9px;border-radius:6px}
.mb.sq.sm{width:20px}
.mb.big{height:34px;font-size:12.5px;padding:0 18px;border-radius:99px}
.mb.full{width:100%}
.mb.hl,.mhl{outline:1.5px dashed var(--spec);outline-offset:3px}
.mhl{border-radius:4px;display:inline-flex;align-items:center}
.mhl.blk{display:flex;border-radius:6px}
.mhl.pk{outline-offset:2px}
.mb.hov{background:var(--btn-hov);box-shadow:0 6px 14px rgba(0,0,0,.18);transform:translateY(-1px)}
.mb.prs{transform:scale(.93);opacity:.82}
.mb.foc{box-shadow:0 0 0 2px var(--paper),0 0 0 4.5px var(--focus)}
.mb.wait{opacity:.85}
.mb.raised{background:linear-gradient(var(--green),color-mix(in srgb,var(--green) 78%,#000));color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--green) 60%,#000),0 6px 12px rgba(0,0,0,.2)}
.mgrp{display:inline-flex;gap:1px}
.mgrp .mb:first-child{border-radius:8px 0 0 8px}
.mgrp .mb:last-child{border-radius:0 8px 8px 0}

/* inputs */
.mi{display:inline-flex;align-items:center;gap:6px;height:28px;width:156px;padding:0 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--paper);color:var(--ink-3);font-size:10.5px;white-space:nowrap;flex:none;overflow:hidden}
.mi.v{color:var(--ink)}
.mi.f{border-color:var(--sel);box-shadow:0 0 0 3px color-mix(in srgb,var(--sel) 22%,transparent)}
.mi.e{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 15%,transparent)}
.mi.ok{border-color:var(--good)}
.mi.ok .ic{color:var(--good)}
.mi.icr>svg:last-child{margin-left:auto;color:var(--ink-3)}
.mi.ta{height:62px;align-items:flex-start;padding-top:8px}
.mi.sm{height:20px;font-size:8.5px;padding:0 6px;border-radius:5px;width:100%}
.mi.w{width:120px}
.mi.w2{width:100%}
.mi.w3{width:110px}
.mi.sm.w{width:120px}.mi.sm.w3{width:96px}
.mph .mi,.mwn .mi{border-width:1px}

/* toggles, checks, radios */
.mt{width:34px;height:20px;border-radius:10px;background:var(--m-sk);position:relative;display:inline-block;flex:none}
.mt i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.mt.on{background:var(--good)}
.mt.on i{left:16px}
.mt.anim{animation:tgbg 3.2s infinite}
.mt.anim i{animation:tgk 3.2s infinite}
@keyframes tgbg{0%,40%{background:var(--good)}50%,90%{background:var(--m-sk)}100%{background:var(--good)}}
@keyframes tgk{0%,40%{left:16px}50%,90%{left:2px}100%{left:16px}}
.mc,.mr{display:inline-flex;align-items:center;gap:7px;color:var(--ink);font-size:10.5px;font-weight:500;white-space:nowrap}
.mc i{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--ink-3);display:grid;place-items:center;flex:none;color:#fff}
.mc.on i,.mc.mix i{background:var(--sel);border-color:var(--sel)}
.mr i{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--ink-3);flex:none;position:relative}
.mr.on i{border-color:var(--sel)}
.mr.on i::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--sel)}

/* skeleton lines, images, avatars */
.ml{display:block;height:5px;border-radius:3px;background:var(--m-sk);flex:none}
.ml.d{background:var(--ink-2);opacity:.75}
.ml.a{background:var(--sel)}
.ml.big{height:8px}
.ml.w{background:#fff;opacity:.85}
.ml.w2{background:#fff;opacity:.4}
.ml.g{background:var(--m-sk)}
.mls{display:flex;flex-direction:column;gap:5px;flex:none}
.mim{display:grid;place-items:center;border-radius:7px;background:linear-gradient(135deg,var(--img1),var(--img2));color:color-mix(in srgb,var(--ink) 28%,transparent);flex:none}
.mim.alt{background:linear-gradient(135deg,var(--img3),var(--img1))}
.mim.alt2{background:linear-gradient(135deg,var(--img2),var(--img4))}
.mav{border-radius:50%;display:grid;place-items:center;color:var(--av-ink);font-weight:650;font-size:11px;flex:none;background:var(--av0)}
.mav.c1{background:var(--av1)}.mav.c2{background:var(--av2)}.mav.c3{background:var(--av3)}.mav.c4{background:var(--av4)}.mav.c5{background:var(--av5)}
.mch{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:12px;border:1px solid var(--line-2);color:var(--ink);font-size:10px;font-weight:550;white-space:nowrap;background:var(--paper)}
.mch.on{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
.mch.dash{border-style:dashed;color:var(--ink-3)}
.mbd{min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:9px;font-weight:700;display:inline-grid;place-items:center;padding:0 4px;font-family:var(--body);font-variant-numeric:tabular-nums;border:2px solid var(--canvas)}
.mbw{position:relative;display:inline-block;color:var(--ink)}
.mbw .mbd{position:absolute;top:-7px;right:-10px}
.mbw .mdot{position:absolute;top:-1px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--canvas)}
.mtag{display:inline-flex;height:18px;align-items:center;padding:0 7px;border-radius:4px;font-size:9px;font-weight:650;color:var(--t0);background:color-mix(in srgb,var(--t0) 14%,transparent)}
.mtag.c1{--t0:var(--good)}.mtag.c2{--t0:var(--ink-2)}.mtag.c3{--t0:var(--spec)}
.mtag{--t0:var(--sel)}
.mpill{display:inline-flex;align-items:center;gap:3px;height:16px;padding:0 6px;border-radius:8px;font-size:8.5px;font-weight:650;color:var(--good);background:color-mix(in srgb,var(--good) 15%,transparent)}
.mpill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,transparent)}
.mpill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.mnt{font-family:var(--body);font-size:8.5px;font-weight:600;color:#fff;background:var(--spec);padding:2px 6px;border-radius:5px;white-space:nowrap;flex:none;line-height:1.25}
.mbx{display:inline-flex;align-items:center;gap:3px;padding:5px 9px;border-radius:8px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);font-size:9.5px;font-weight:550;white-space:nowrap;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.mbx.p{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
.mbx.hl2{border-color:var(--spec);color:var(--spec);box-shadow:0 0 0 3px color-mix(in srgb,var(--spec) 18%,transparent)}
.mbx.ok{border-color:var(--good);color:var(--good)}
.mbx.bad{border-color:var(--bad);color:var(--bad)}
.mar{color:var(--ink-3);display:inline-flex;flex:none}
.mar.dn{transform:rotate(120deg)} .mar.sm .ic{width:10px;height:10px} .mar.ok{color:var(--good)}
.mst{display:inline-block;width:46px;min-height:38px;padding:5px;font-size:8px;line-height:1.15;color:#2a2410;box-shadow:0 2px 4px rgba(0,0,0,.15);background:#FFE58A;font-weight:600;flex:none}
.mst.c1{background:#FFC2D6}.mst.c2{background:#BDEBD2}.mst.c3{background:#C6D5FF}
.mst .ml{background:rgba(0,0,0,.18)}
.mkbd{display:inline-flex;align-items:center;font-family:var(--body);font-variant-numeric:tabular-nums;font-size:10px;font-weight:600;padding:3px 7px;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:5px;color:var(--ink);background:var(--paper)}
.mkbd.s{font-size:8px;padding:1px 4px;border-width:1px;margin-left:auto}
.msw{display:inline-block;border-radius:6px;flex:none}
.mbars{display:flex;align-items:flex-end;gap:5px}
.mbars i{display:block;background:var(--green);border-radius:4px 4px 0 0;opacity:.9}
.mov{position:absolute;inset:0;background:rgba(10,12,22,.42)}
.mov.dark{background:rgba(6,8,14,.75)}
.mov.spot{background:radial-gradient(circle at calc(100% - 23px) calc(100% - 25px),transparent 22px,rgba(8,10,18,.6) 23px)}
.mov.a-ov{animation:ovf 4s infinite}
@keyframes ovf{0%,12%{opacity:0}30%,78%{opacity:1}92%,100%{opacity:0}}
.mcur{fill:var(--ink);stroke:var(--paper);stroke-width:1.6;display:block}

/* menus, bars, tabs */
.mmenu{background:var(--paper);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.1);padding:4px;display:flex;flex-direction:column;min-width:120px;flex:none}
.mmenu span{padding:5px 8px;border-radius:5px;color:var(--ink);font-size:10px;white-space:nowrap;display:block}
.mmenu span .mkbd.s{float:right;margin-left:10px}
.mmenu span.on{background:color-mix(in srgb,var(--sel) 13%,transparent);color:var(--sel)}
.mmenu b{font-weight:700}
.mrec{font-style:normal;font-family:var(--body);font-variant-numeric:tabular-nums;font-size:8px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.mtop{display:flex;align-items:center;gap:5px;color:var(--ink);padding:1px 2px 3px;flex:none;width:100%}
.mtop b{font-size:9px;font-weight:700;flex:1}
.mtop i{flex:1}
.mtop.hl{outline:1.5px dashed var(--spec);outline-offset:2px;border-radius:3px}
.mtabb{margin-top:auto;display:flex;justify-content:space-around;border-top:1px solid var(--line);padding-top:5px;color:var(--ink-3);width:100%}
.mtabb span.on{color:var(--sel)}
.mtabb.hl{outline:1.5px dashed var(--spec);outline-offset:2px;border-radius:3px}
.mtabs{display:flex;gap:6px;border-bottom:1.5px solid var(--line);position:relative}
.mtabs span{width:56px;text-align:center;padding:5px 0 6px;font-size:10px;color:var(--ink-3);font-weight:600}
.mtabs span:first-child{color:var(--sel)}
.mtabs b{position:absolute;left:0;bottom:-1.5px;height:2.5px;width:56px;border-radius:2px;background:var(--sel)}
.mtabs.anim b{animation:tabs 4.5s infinite cubic-bezier(.6,0,.3,1)}
.mtabs.anim span:first-child{animation:tab1 4.5s infinite}
.mtabs.anim span:nth-child(2){animation:tab2 4.5s infinite}
.mtabs.anim span:nth-child(3){animation:tab3 4.5s infinite}
@keyframes tabs{0%,25%{transform:translateX(0)}33%,58%{transform:translateX(62px)}66%,91%{transform:translateX(124px)}100%{transform:translateX(0)}}
@keyframes tab1{0%,25%,100%{color:var(--sel)}33%,91%{color:var(--ink-3)}}
@keyframes tab2{0%,25%,66%,100%{color:var(--ink-3)}33%,58%{color:var(--sel)}}
@keyframes tab3{0%,58%,100%{color:var(--ink-3)}66%,91%{color:var(--sel)}}
.mseg{display:inline-flex;background:var(--m-fill);border-radius:8px;padding:2px;gap:2px}
.mseg i{font-style:normal;padding:4px 10px;border-radius:6px;font-size:10px;color:var(--ink-2);font-weight:600}
.mseg i.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.mseg.big i{padding:7px 16px;font-size:11.5px}
.mseg.tb i{width:38px;text-align:center;font-size:14px}
.mseg.tb i.on{background:var(--btn);color:var(--on-btn)}

/* slider, progress, spinner */
.msl{width:150px;height:5px;border-radius:3px;background:var(--m-sk);position:relative;display:block;flex:none}
.msl i{position:absolute;left:0;top:0;bottom:0;background:var(--sel);border-radius:3px}
.msl b{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;border:2.5px solid var(--sel);transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.msl.anim i{animation:slw 4s infinite ease-in-out}
.msl.anim b{animation:sll 4s infinite ease-in-out}
@keyframes slw{0%,100%{width:60%}50%{width:25%}}
@keyframes sll{0%,100%{left:60%}50%{left:25%}}
.msl.rng{width:160px}
.mpb{width:170px;height:8px;border-radius:4px;background:var(--m-sk);overflow:hidden;display:block;flex:none}
.mpb i{display:block;height:100%;background:var(--sel);border-radius:4px}
.mpb.anim i{animation:pbf 3.6s infinite ease-out}
.mpb.fast i{animation:pbf .9s infinite ease-out;background:var(--warn)}
.mpb.xs{width:120px;height:4px}
@keyframes pbf{0%{width:4%}70%,100%{width:var(--w,64%)}}
.mspin{width:30px;height:30px;border-radius:50%;border:3px solid var(--m-sk);border-top-color:var(--sel);animation:spin .9s linear infinite;flex:none;display:inline-block}
.mspin.xs{width:12px;height:12px;border-width:2px}
.mspin.w{border-color:rgba(255,255,255,.35);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.mdots{display:inline-flex;gap:5px}
.mdots i{width:6px;height:6px;border-radius:3px;background:var(--m-sk);transition:width .3s}
.mdots i.on{background:var(--sel);width:16px}
.mdots.anim i{animation:dotc 6s infinite}
.mdots.anim i:nth-child(2){animation-delay:-4s}.mdots.anim i:nth-child(3){animation-delay:-2s}
.mdots.anim i.on{width:6px;background:var(--m-sk)}
@keyframes dotc{0%,30%{width:16px;background:var(--sel)}33.3%,100%{width:6px;background:var(--m-sk)}}
.mstars{display:inline-flex;gap:3px;color:var(--m-sk)}
.mstars span.on{color:var(--warn)}
.mstars.anim span{animation:starp 3s infinite}
.mstars.anim span:nth-child(2){animation-delay:.1s}.mstars.anim span:nth-child(3){animation-delay:.2s}.mstars.anim span:nth-child(4){animation-delay:.3s}.mstars.anim span:nth-child(5){animation-delay:.4s}
@keyframes starp{0%,8%,100%{transform:scale(1)}4%{transform:scale(1.3)}}

// chess board from FEN rows. o = {f:[0,7] files, r:[1,8] ranks, hl:{e4:'g'|'r'|'b'}, ar:[['e2','e4','g']], s:size}
const PCS={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
const BOARD=(fen,o={})=>{
  const rows=fen.split('/').map(r=>r.replace(/\d/g,d=>'.'.repeat(+d)));
  const [f0,f1]=o.f||[0,7],[r0,r1]=o.r||[1,8],nf=f1-f0+1,nr=r1-r0+1;
  const s=o.s||Math.min(30,Math.floor(170/nr),Math.floor(260/nf)),W=nf*s,H=nr*s;
  const sq=n=>[n.charCodeAt(0)-97,+n[1]], cx=f=>(f-f0)*s+s/2, cy=r=>(r1-r)*s+s/2;
  let g='';
  for(let r=r1;r>=r0;r--)for(let f=f0;f<=f1;f++){
    const x=(f-f0)*s,y=(r1-r)*s,nm=String.fromCharCode(97+f)+r,h=o.hl&&o.hl[nm];
    g+=`<rect x="${x}" y="${y}" width="${s}" height="${s}" class="${(f+r)%2?'l':'d'}${h?' h'+h:''}"/>`;
    const p=rows[8-r]&&rows[8-r][f]; if(p&&p!=='.'){const w=p===p.toUpperCase();
      g+=`<text x="${x+s/2}" y="${y+s*.8}" font-size="${s*.86}" class="${w?'pw':'pb'}">${PCS[p.toLowerCase()]}&#xFE0E;</text>`}
  }
  (o.ar||[]).forEach(([a,b,k])=>{const [fa,ra]=sq(a),[fb,rb]=sq(b),x1=cx(fa),y1=cy(ra),x2=cx(fb),y2=cy(rb),an=Math.atan2(y2-y1,x2-x1),hd=s*.34;
    const ex=x2-Math.cos(an)*s*.18,ey=y2-Math.sin(an)*s*.18;
    g+=`<g class="ar ${k||'g'}"><line x1="${x1}" y1="${y1}" x2="${ex-Math.cos(an)*hd*.6}" y2="${ey-Math.sin(an)*hd*.6}" stroke-width="${s*.16}"/><path d="M${ex} ${ey}L${ex-hd*Math.cos(an-.55)} ${ey-hd*Math.sin(an-.55)}L${ex-hd*Math.cos(an+.55)} ${ey-hd*Math.sin(an+.55)}Z"/></g>`});
  let lab='';if(o.lab!==false){for(let f=f0;f<=f1;f++)lab+=`<text x="${(f-f0)*s+s/2}" y="${H+9}" class="cl">${String.fromCharCode(97+f)}</text>`;for(let r=r0;r<=r1;r++)lab+=`<text x="-5" y="${(r1-r)*s+s/2+3}" class="cl">${r}</text>`}
  return `<svg class="mboard" width="${W+10}" height="${H+12}" viewBox="-10 0 ${W+10} ${H+12}">${g}<rect class="bd" x="0" y="0" width="${W}" height="${H}"/>${lab}</svg>`};

D('law','Affordance',"A quality that suggests how something can be used. A raised, shaded button suggests it can be pressed.",
 R(KC(B('Press','raised')+T('looks pressable','help'),8)+KC(T('Press','flatword')+T('looks like text','help'),8),20));
D('law','Signifier',"A visible cue that shows where and how to act, like a grip handle on a row you can drag.",
 C(K(R(HL(ic('grip',12))+LS(90,60)+SP()+NT('signifier'),8,'width:190px')+DIV()+R(`<span style="color:var(--ink-3)">${ic('grip',12)}</span>`+LS(80,50),8,'width:190px')+DIV()+R(`<span style="color:var(--ink-3)">${ic('grip',12)}</span>`+LS(96,40),8,'width:190px'),7),'padding:10px'));
D('law','Feedback',"A clear response to every action, so people know the system heard them and what happened.",
 KC(R(B(ic('send',11)+'Send')+AR()+B(ic('check',11)+'Sent','ok'),10)+T('every action gets a reaction','help'),10));
D('law','Mapping',"Arranging controls to mirror what they affect, like stove knobs laid out in the same pattern as the burners.",
 SVG(210,110,`<rect x="6" y="6" width="112" height="98" rx="10" class="k"/>${[[34,34,14],[90,34,18],[34,78,18],[90,78,14]].map(([x,y,r],i)=>`<circle cx="${x}" cy="${y}" r="${r}" class="${i===1?'a':'k'}" stroke-width="2.5"/>`).join('')}${[[150,38],[182,38],[150,72],[182,72]].map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="10" class="${i===1?'a':'k'}"/><path d="M${x} ${y}V${y-7}" class="${i===1?'a':'k'}"/>`).join('')}<text x="166" y="102" text-anchor="middle">knobs</text>`));
D('law','Constraints',"Limiting what people can do so mistakes are impossible, like greying out dates that have already passed.",
 R(CAL(23,19,'dis')+NT('past dates blocked'),10,'align-items:flex-start'));
D('law','Consistency',"Similar things look and work the same way everywhere, so people learn something once and reuse it.",
 R([0,1,2].map(i=>C(K(IM(56,30)+L(40,'d')+B('Buy','p sm'),5),'padding:7px')).join(''),8));
D('law','Mental model',"What people believe about how a system works, based on past experience with other things.",
 R(KC(`<span class="mthink">${ic('folder',18)}${ic('file',13)}</span>`+AV(1,34,ic('user',17)),4)+AR()+KC(ic('monitor',40)+T('matches their expectation','help'),4),12,'align-items:flex-end'));
D('law','Cognitive load',"The mental effort needed to use something. Good design keeps it as low as possible.",
 R(KC(C(`<div class="mclut">${[CH('New',1),BD('9'),L(30,'d'),B('Go','p sm'),CH('Sale'),L(20),ic('bell',10),B('Buy','d sm'),L(26),CH('Hot',1),ic('star',10),L(18)].join('')}</div>`,'padding:7px;width:96px')+T('high load','help'),6)+KC(C(K(L(50,'d')+L(70)+B('Continue','p sm'),6,'align-items:center'),'padding:10px;width:96px')+T('low load','help'),6),14));
D('law',"Hick's law","The more choices people have, the longer it takes them to decide.",
 R(KC(R(B('Yes','s sm')+B('No','s sm'),5)+T(ic('clock',10)+' quick','help'),8)+KC(`<div class="mmany">${Array.from({length:12},()=>'<i></i>').join('')}</div>`+T(ic('clock',10)+' slow','help'),8),20));
D('law',"Fitts's law","The time to hit a target depends on its size and distance: big, close targets are faster to reach.",
 SVG(230,112,`<path d="M30 86 L104 66" class="a dash"/><path d="M30 86 L206 24" class="p dash"/><circle cx="110" cy="64" r="20" class="fa" opacity=".9"/><circle cx="208" cy="23" r="6" class="fp"/><path d="M22 76l12 7-5 1.5-3 5z" class="fk"/><text x="110" y="100" text-anchor="middle">near + big = fast</text><text x="196" y="48" text-anchor="middle">far + small = slow</text>`));
D('law',"Jakob's law","People spend most of their time on other products, so they expect yours to work the same way.",
 KC(R([0,1,2].map(()=>`<div class="mwn mini" style="width:84px"><div class="mtopw">${L(12,'d')}${L(22)}<i class="msp"></i>${ic('cart',8)}</div><div class="mwn-c">${R(IM(22,18)+IM(22,18)+IM(22,18),3)}${L(56)}</div></div>`).join(''),8)+T('logo left, search, cart right: familiar everywhere','help'),8));
D('law',"Miller's law","People can hold only about 7 (plus or minus 2) items in working memory, so group and limit information.",
 KC(`<span class="mmiller">${Array.from({length:7},(_,i)=>`<i style="animation-delay:${i*.15}s"></i>`).join('')}</span>`+T('7 ± 2','num'),10));
D('law','Chunking',"Breaking information into small, meaningful groups so it's easier to scan and remember.",
 KC(T('08031234567','mono hard')+T('↓','help')+T('0803 123 4567','mono big'),6));
D('law',"Tesler's law","Every system has some complexity that can't be removed, only moved. Ideally, the system absorbs it instead of the user.",
 R(KC(AV(1,32,ic('user',16))+T('user','help'),4)+`<div class="mtes"><span class="a-tes">complexity</span></div>`+KC(CIRC(ic('gear',18))+T('system','help'),4),6));
D('law','Doherty threshold',"When a system responds in under about 400 milliseconds, people stay engaged and work faster.",
 KC(R(`<span style="color:var(--warn)">${ic('bolt',22)}</span>`+T('&lt; 400 ms','num'),6)+PB(100,'fast')+T('respond before attention drifts','help'),8));
D('law','Aesthetic–usability effect',"People tend to see attractive designs as easier to use, even when they work the same.",
 R(KC(C(K(L(50)+`<span class="mplain">Email</span><span class="mplain">Password</span><span class="mplain b">OK</span>`,4),'padding:7px;width:92px;border-radius:2px')+T('seems harder','help'),6)+KC(C(K(L(50,'d')+IN('Email','sm')+IN('Password','sm')+B('Sign in','p sm full'),5),'padding:8px;width:96px')+T('seems easier','help'),6),14));
D('law','Von Restorff effect',"The item that stands out from the rest is the one people notice and remember. Also called the isolation effect.",
 R([0,0,0,1,0,0].map(o=>`<i class="mvr ${o?'on a-pulse':''}"></i>`).join(''),10));
D('law','Serial position effect',"People best remember the first and last items in a list, and forget the middle.",
 C(K([1,0,0,0,0,1].map((h,i)=>R(T(i+1,'num-xs')+L([90,70,80,64,76,86][i],h?'a':''),8)).join(''),7),'padding:10px 14px'));
D('law','Peak–end rule',"People judge an experience mostly by its most intense moment and how it ended, not by the average.",
 SVG(220,110,`<path d="M10 80 C40 76 50 70 70 72 S95 20 110 22 S130 70 150 66 S185 40 205 34" class="a" stroke-width="2.5"/><circle cx="110" cy="22" r="5" class="fp"/><circle cx="205" cy="34" r="5" class="fp"/><text x="110" y="12" text-anchor="middle">peak</text><text x="200" y="22" text-anchor="middle">end</text><path d="M10 96H210" class="m"/><text x="12" y="106">start</text>`));
D('law','Zeigarnik effect',"People remember unfinished tasks better than finished ones, which is why progress meters pull people back.",
 C(K(R(T('Profile 80% complete','lbl')+SP(),0,'width:160px')+PB(80)+CB(1,'Add a photo')+CB(1,'Verify email')+CB(0,'Link a bank account'),6),'padding:11px'));
D('law','Goal-gradient effect',"People speed up as they get closer to a goal, like a loyalty card that's almost full.",
 C(K(R(T('Coffee card','lbl')+SP()+T('8 / 10','num-sm'),0,'width:170px')+`<div class="mstamp">${Array.from({length:10},(_,i)=>`<i class="${i<8?'on':''}">${i<8?ic('coffee',11):''}</i>`).join('')}</div>`+T('2 more for a free coffee','help'),7),'padding:11px'));
D('law','Law of proximity',"Things placed close together are seen as a group, even if they look different.",
 SVG(210,90,[[20,20],[70,20]].map(()=>'').join('')+[0,1].map(g=>[0,1,2].map(r=>[0,1,2].map(c=>`<circle cx="${20+g*110+c*20}" cy="${20+r*24}" r="6" class="fk"/>`).join('')).join('')).join('')));
D('law','Law of similarity',"Things that look alike, in color, shape or size, are seen as related.",
 SVG(200,96,[0,1,2,3,4,5].map(c=>[0,1,2].map(r=>c%2?`<rect x="${12+c*32}" y="${12+r*28}" width="14" height="14" rx="2" class="fa"/>`:`<circle cx="${19+c*32}" cy="${19+r*28}" r="7" class="fk"/>`).join('')).join('')));
D('law','Law of common region',"Things inside the same boundary, like a card or a box, are seen as one group.",
 SVG(220,80,`<rect x="6" y="12" width="96" height="56" rx="10" class="a dash"/><rect x="118" y="12" width="96" height="56" rx="10" class="a dash"/>${[0,1,2,3,4,5].map(i=>`<circle cx="${28+i*33+(i>2?16:0)}" cy="40" r="7" class="fk"/>`).join('')}`));
D('law','Law of closure',"People fill in gaps and see a complete shape even when parts of it are missing.",
 SVG(200,96,`<circle cx="50" cy="48" r="34" class="k" stroke-width="5" stroke-dasharray="40 14"/><path d="M118 14h20M118 14v20M182 14h-20M182 14v20M118 82h20M118 82v-20M182 82h-20M182 82v-20" class="k" stroke-width="5"/>`));
D('law','Law of Prägnanz',"People interpret complex or ambiguous shapes in the simplest way possible.",
 KC(SVG(160,84,`<circle cx="56" cy="42" r="30" class="k" stroke-width="2.5"/><rect x="66" y="16" width="52" height="52" class="a" stroke-width="2.5"/><path d="M108 70l26-44 22 44z" class="p" stroke-width="2.5"/>`)+T('seen as a circle, a square and a triangle','help'),6));
D('law','Figure–ground',"People separate what they see into an object in front (figure) and the background behind it (ground).",
 R(SVG(90,90,`<rect width="90" height="90" rx="12" class="fk"/><path d="M45 14l9.5 19.5 21.5 3-15.5 15 3.7 21.4L45 63 25.8 73l3.7-21.4L14 36.5l21.5-3z" class="fw"/>`)+K(NT('figure: the star')+NT('ground: the square'),10),12));
D('law','Law of continuity',"The eye follows lines and curves, so items arranged along a path are seen as related.",
 SVG(210,100,Array.from({length:12},(_,i)=>{const x=10+i*17;return `<circle cx="${x}" cy="${50+Math.sin(i/11*Math.PI*2)*30}" r="5" class="fa"/><circle cx="${x}" cy="${88-i*6.5}" r="4" class="fk"/>`}).join('')));
D('law','Common fate',"Elements that move together in the same direction are seen as a group.",
 R(Array.from({length:7},(_,i)=>`<i class="mcf ${[1,3,5].includes(i)?'a-fate':''}"></i>`).join(''),12));
D('law','Pareto principle',"Roughly 80% of effects come from 20% of causes, so a few key features deliver most of the value. Also called the 80/20 rule.",
 K(R(`<span class="mpar2 a" style="width:36px"></span>`+T('20% of features','help'),8)+R(`<span class="mpar2" style="width:150px"></span>`+T('80% of use','help'),8),10));
D('law',"Postel's law","Be liberal in what you accept and strict in what you send, like accepting phone numbers in any format.",
 R(K(IN('+234 803 123 4567','v sm w')+IN('0803-123-4567','v sm w')+IN('8031234567','v sm w'),5)+AR()+KC(T(ic('check',12),'ok2')+T('+2348031234567','mono'),4),8));
D('law','Recognition over recall',"Showing options people can recognize is easier than making them remember things from scratch.",

D('law','Visibility of system status',"Always keeping people informed about what's going on, through timely feedback.",
 C(K(R(SPIN('xs')+T('Uploading 3 of 5 photos','lbl'),6)+PB(60,'anim')+T('Keep this tab open','help'),7),'padding:12px'));
D('law','Match with the real world',"Speaking the user's language, with familiar words and concepts instead of system jargon.",
 R(KC(T('Error 0x80070005','mono err')+T('system speak','help'),6)+AR()+KC(C(T("You can't open this file. Ask the owner for access.",'w140'),'padding:8px')+T('human speak','help'),6),8));
D('law','User control and freedom',"Giving people clear ways out, like Undo, Cancel and Back, when they take a wrong turn.",
 C(K(R(T('Editing photo','lbl')+SP()+ic('x',11),0,'width:160px')+IM(160,46)+R(B(ic('undo',11)+'Undo','s sm')+B('Cancel','g sm')+SP()+B('Done','p sm'),5,'width:160px'),7),'padding:10px'));
D('law','Error prevention',"Designing so mistakes are hard to make in the first place, rather than just reporting them afterwards.",
 C(K(R(`<span style="color:var(--warn)">${ic('warn',14)}</span>`+T('No attachment?','lbl big'),6)+T('You wrote "attached" but added no file.','help')+R(B('Send anyway','g sm')+B('Attach file','p sm'),5,'align-self:flex-end'),6),'width:190px;padding:11px'));
D('law','Flexibility and efficiency',"Offering shortcuts and accelerators for experts without getting in the way of beginners.",
 MENU([`Copy<span class="mkbd s">⌘C</span>`,`Paste<span class="mkbd s">⌘V</span>`,`Find<span class="mkbd s">⌘F</span>`,`Undo<span class="mkbd s">⌘Z</span>`],0,'width:150px'));
D('law','Minimalist design',"Removing anything that doesn't support the user's goal, because every extra element competes for attention.",
 PH(KC(T('Balance','tiny')+T('₦52,400','num md')+B('Send money','p sm full'),8,'margin:auto 0;width:100%')));
D('law','Help and documentation',"Making help easy to find, focused on the user's task, and written as concrete steps.",

D('law',"Nielsen's 10 heuristics","Ten broad rules of thumb for usable interfaces, published by Jakob Nielsen in 1994 and still widely used.",
 `<div class="mnh">${['Status','Real world','Control','Consistency','Prevention','Recognition','Flexibility','Minimalism','Recovery','Help'].map((t,i)=>`<span><b>${i+1}</b>${t}</span>`).join('')}</div>`);
D('law','Banner blindness',"People tend to ignore anything that looks like an ad, even when it holds useful information.",

D('law','Z-pattern',"How the eye moves across simple pages: top left to top right, diagonally down, then across the bottom.",

/* ===== Research & Testing ===== */
D('res','User research',"Studying people's needs, behaviors and motivations so design decisions are based on evidence, not guesses.",
 R(MRL(AV(1,46,ic('user',22))+A(`<span class="mmag">${ic('search',34)}</span>`,'left:22px;top:20px'),72,72)+K(ST('needs',0)+ST('habits',1)+ST('goals',2),5),14));
D('res','User interview',"A one-on-one conversation to learn about someone's experiences, needs and frustrations.",

D('res','Usability testing',"Watching real people try to complete tasks with a design to find where they struggle.",
 R(KC(AV(1,34,ic('user',17))+T('participant','help'),4)+C(K(T('Task 2: Pay a bill','lbl')+IM(120,40)+R(PILL(ic('check',9)+' 3 passed')+PILL(ic('x',9)+' 2 failed','bad'),5),6),'padding:9px'),12));

D('res','A/B testing',"Showing two versions to different groups of real users to see which one performs better.",
 R(KC(T('A','ab')+PH(KC(IM(36,26)+L(30)+B('Buy','s sm'),5,'margin:auto 0'),'','mini')+T('3.1%','num-sm'),5)+KC(T('B','ab')+PH(KC(IM(36,26)+L(30)+B('Buy now','p sm'),5,'margin:auto 0'),'','mini')+T('4.6% '+ic('check',10),'num-sm ok2'),5),22));
D('res','Card sorting',"Participants group topics into categories to show how they expect content to be organized.",

D('res','Tree testing',"Checking whether people can find items in a text-only version of your navigation, without any visual design.",

D('res','Contextual inquiry',"Observing and interviewing people in the place where they actually do the work.",
 R(KC(R(AV(1,30,ic('user',14))+ic('monitor',32),2,'align-items:flex-end')+T('their real setting','help'),5)+KC(ic('file',28)+T('observer notes','help'),5),22));
D('res','Survey',"A set of questions sent to many people to collect answers at scale.",
 C(K(T('How easy was checkout?','lbl')+`<span class="mscale">${[1,2,3,4,5].map(n=>`<i class="${n===4?'on':''}">${n}</i>`).join('')}</span>`+R(T('Very hard','tiny')+SP()+T('Very easy','tiny'),0,'width:150px'),7),'padding:12px'));

D('res','User story',"A short need written as: As a [type of user], I want [goal] so that [reason].",

D('res','Competitive analysis',"Studying rival products to find their strengths, gaps and opportunities for you.",

D('res','Qualitative research',"Research that explains why and how, using words, quotes and observations from a small number of people.",
 K(BUB('"I never know where my money goes."','l')+BUB('"Budget apps feel like homework."','l')+T('why and how','help'),6));

D('res','Five-second test',"Showing a design for five seconds, then asking what people remember, to test first impressions.",

D('res','First-click testing',"Checking where people click first when trying to do a task. A good first click predicts success.",

D('res','Guerrilla testing',"Quick, informal tests with people in public places like a café, trading a few minutes for a coffee.",
