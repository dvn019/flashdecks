D('res','Insight',"A clear, useful finding that explains why users behave a certain way and points to what to do next.",
 R(K(ST(LS(24,18),0)+ST(LS(24,18),1),4)+K(ST(LS(24,18),2)+ST(LS(24,18),0),4)+AR()+`<span class="a-glow2" style="color:var(--warn)">${ic('bulb',38)}</span>`,8));
/* ===== Process & Deliverables ===== */
D('prc','Design thinking',"A problem-solving approach in five stages: empathize, define, ideate, prototype and test.",
 KC(R(BX('Empathize')+AR()+BX('Define')+AR()+BX('Ideate'),3)+R(AR('dn')+BX('Prototype')+AR()+BX('Test')+`<span class="mar">${ic('refresh',13)}</span>`,3),8));
D('prc','Double Diamond',"A design process that widens then narrows twice: discover, define, develop and deliver.",
 SVG(230,100,`<path d="M8 50L60 12L112 50L60 88Z" class="a" stroke-width="2"/><path d="M118 50L170 12L222 50L170 88Z" class="p" stroke-width="2"/>${[['Discover',34],['Define',86],['Develop',144],['Deliver',196]].map(([t,x])=>`<text x="${x}" y="54" text-anchor="middle">${t}</text>`).join('')}<text x="60" y="100" text-anchor="middle">problem</text><text x="170" y="100" text-anchor="middle">solution</text>`));
D('prc','How might we (HMW)',"Turning a problem into an open question that invites ideas, like 'How might we help people save small amounts?'",
 ST('<b>How might we</b> help first-time savers start small?',0,'width:150px;height:auto;padding:12px;font-size:12px;line-height:1.35;transform:rotate(-2deg)'));
D('prc','Ideation',"Generating many ideas quickly, without judging them, before choosing which to pursue.",
 MRL([[0,0,-6],[60,8,4],[120,0,-3],[20,50,3],[84,56,-5],[146,48,6]].map(([x,y,r],i)=>A(ST(LS(26,20),i%4,`transform:rotate(${r}deg)`),`left:${x}px;top:${y}px`)).join('')+A(`<span class="a-glow2" style="color:var(--warn)">${ic('bulb',26)}</span>`,'left:86px;top:24px'),190,100));
D('prc','Crazy 8s',"A sketching exercise: fold paper into eight panels and sketch eight ideas in eight minutes.",
 R(`<div class="mc8">${Array.from({length:8},(_,i)=>`<i>${i%3===0?IM(26,14):LS(24,16)}</i>`).join('')}</div>`+KC(ic('clock',22)+T('8:00','num-sm'),4),12));
D('prc','Wireframe',"A simple layout sketch showing structure and content placement, without colors or visual styling.",
 WN(`<div class="mwire">${R(`<i class="x" style="width:70px;height:46px"></i>`+K(L(80,'g')+L(60,'g')+L(70,'g')+`<i class="b"></i>`,6),10)}${R(`<i style="width:54px;height:20px"></i><i style="width:54px;height:20px"></i><i style="width:54px;height:20px"></i>`,8)}</div>`));
D('prc','Mockup',"A static, realistic picture of how the final design will look, with real colors, type and images.",
 PH(`<div class="mmock"><b>Hello, Ada</b><span class="bal">₦52,400</span>${R(`<i class="c0"></i><i class="c1"></i><i class="c2"></i>`,5)}${K(LROW(0,[30,20])+LROW(2,[34,22]),5)}</div>`,'','np'));
D('prc','Prototype',"A clickable simulation of a design, used to test the flow with people before anything is built.",
 R(PH(TOP('Shop')+IM(70,40)+L(50,'d')+`<span class="mrel" style="align-self:stretch">${B('Buy','p sm full')}<i class="mhot"></i></span>`)+AR()+PH(KC(CIRC(ic('check',16))+L(40,'d')+L(50),6,'margin:auto 0;width:100%')),8));
D('prc','Low fidelity',"Rough and quick: sketches or plain boxes that are cheap to make and easy to change.",
 `<div class="mlofi">${R('<i class="x" style="width:60px;height:40px"></i>'+K('<i class="ln" style="width:70px"></i><i class="ln" style="width:50px"></i><i class="ln" style="width:60px"></i>',6),10)}<i class="bt">Button</i></div>`);
D('prc','High fidelity',"Detailed and polished, close to the final product in look and behavior.",
 PH(`<div class="mmock"><b>Hello, Ada</b><span class="bal">₦52,400</span>${B('Send money','p sm full')}${K(LROW(0,[30,20])+LROW(2,[34,22]),5)}</div>`,'','np'));
D('prc','User flow',"A diagram of every step and decision a user goes through to complete a task.",
 R(BX('Open app')+AR()+`<span class="mdia"><em>Logged in?</em></span>`+K(R(T('yes','tiny')+AR('sm')+BX('Home'),3)+R(T('no','tiny')+AR('sm')+BX('Log in'),3),10),4));
D('prc','Task flow',"A single straight path for one specific task, with no branches or decisions.",
 FL('Cart','Address','Pay','Done'));
D('prc','Sitemap',"A diagram of all the pages in a website or app and how they're organized.",
 TREE('Home',['About','Products','Contact']));
D('prc','Storyboard',"A comic-strip sequence showing a user's situation and how the product helps them.",
 R(['Stuck in traffic','Opens the app','Pays the bill'].map((c,i)=>`<div class="msb">${ic(['clock','phone','check'][i],20)}<em>${c}</em></div>`).join(''),5));
D('prc','Minimum viable product (MVP)',"The smallest version of a product that delivers real value and lets the team learn from users.",
 R(KC(`<span class="mmvp" style="width:22px;height:22px"></span>`+T('v1','tiny'),4)+AR()+KC(`<span class="mmvp" style="width:36px;height:36px"></span>`+T('v2','tiny'),4)+AR()+KC(`<span class="mmvp" style="width:52px;height:52px"></span>`+T('v3','tiny'),4),8,'align-items:flex-end'));
D('prc','Design sprint',"A five-day process for going from a problem to a tested prototype.",
 R(['Mon','Tue','Wed','Thu','Fri'].map((d,i)=>KC(T(d,'tiny b')+`<span class="msprint ${i===4?'on':''}">${['Map','Sketch','Decide','Build','Test'][i]}</span>`,4)).join(''),4));
D('prc','Iteration',"Improving a design through repeated cycles of building, testing and learning.",
 CYC(['Build','Test','Learn'],T('v3','num-sm')));
D('prc','Design critique',"A structured session where peers give feedback on a design against its goals.",
 MRL(WN(R(IM(80,44)+LS(80,60),8)+LS(170,140)+B('Continue','p sm'),'width:200px;height:110px')+A(`<span class="mcmt">${AV(0,14)}</span>`,'left:50px;top:30px')+A(`<span class="mcmt">${AV(3,14)}</span>`,'left:170px;top:84px'),210,116));
D('prc','Service blueprint',"A diagram of a service showing what customers see, what staff do, and the systems behind the scenes.",
 `<div class="mblue"><span><em>Customer</em>${BX('Orders')}${BX('Pays')}${BX('Gets food')}</span><i class="lov">line of visibility</i><span><em>Staff</em>${BX('Cooks')}${BX('Packs')}</span><span><em>Systems</em>${BX('POS')}${BX('Delivery API')}</span></div>`);
D('prc','Touchpoint',"Any moment where a person comes into contact with a product or brand, like an ad, an app, an email or a call.",
 MRL(A(AV(1,34,ic('user',16)),'left:78px;top:38px')+[['monitor',0,0],['mail',150,0],['phone',0,80],['store',150,80]].map(([n,x,y])=>A(CIRC(ic(n,13)),`left:${x+8}px;top:${y+6}px`)).join('')+SVG(190,110,`<path d="M30 22L84 50M160 22L106 50M30 88L84 64M160 88L106 64" class="m dash"/>`,'abs'),190,110));
D('prc','Moodboard',"A collage of images, colors, textures and type that sets the visual direction for a project.",
 `<div class="mmood"><i class="a"></i><i class="b">Aa</i><i class="c"></i><i class="d"></i><i class="e"></i></div>`);
D('prc','Annotations',"Notes on a design that explain behavior, rules or intent so developers build it correctly.",
 R(PH(TOP('Profile')+`<span class="mrel">${AV(2,26)}<span class="mpin s" style="right:-8px;top:-6px">1</span></span>`+L(50,'d')+`<span class="mrel" style="align-self:stretch">${B('Edit','s sm full')}<span class="mpin s" style="right:-6px;top:-6px">2</span></span>`)+K(R(`<span class="mpin">1</span>`+T('Tap to change photo','tiny'),4)+R(`<span class="mpin">2</span>`+T('Opens edit sheet','tiny'),4),10),10));
D('prc','Edge case',"An unusual situation the design still has to handle, like a very long name, no data or a slow network.",
 C(R(AV(2,26)+K(T('Oluwaseyifunmi Adebayo-Ogunl…','lbl trunc')+T('A real name, 34 characters','help'),2,'min-width:0'),8,'width:190px'),'padding:10px'));
D('prc','Happy path',"The ideal route through a flow where everything goes right, with no errors or detours.",
 R(BX('Sign up','ok')+AR('ok')+BX('Verify','ok')+AR('ok')+BX('Done '+ic('check',10),'ok'),3));

/* ===== Metrics ===== */
D('met','Conversion rate',"The percentage of visitors who complete a goal, like buying or signing up.",
 KC(R(`<span class="mppl">${Array.from({length:30},(_,i)=>`<i class="${[4,17,26].includes(i)?'on':''}"></i>`).join('')}</span>`,0)+T('3 of 100 visitors bought: 3% conversion','help'),8));
D('met','Funnel',"The series of steps toward a goal, showing how many people drop off at each one.",
 `<div class="mfun">${[['Visit',100],['Cart',42],['Checkout',18],['Paid',9]].map(([t,v])=>`<span><i style="width:${v*1.5}px"></i><em>${t}</em><b>${v}%</b></span>`).join('')}</div>`);
D('met','Bounce rate',"The percentage of visitors who leave after viewing only one page.",
 R(`<div class="mwn mini"><div class="mwn-b"><i></i><i></i><i></i></div><div class="mwn-c">${L(50,'d')}${LS(70,60)}</div></div>`+`<span class="mbounce a-bounce"></span>`+T('left after 1 page','help'),8,'align-items:flex-end'));
D('met','Churn rate',"The percentage of users or customers who stop using a product over a period of time.",
 R(`<span class="mppl big">${Array.from({length:10},(_,i)=>`<i class="${i>7?'out a-churn':''}"></i>`).join('')}</span>`+T('20% churned this month','help'),10));
D('met','Retention',"How many users keep coming back over time after they first start.",
 SVG(210,100,`<path d="M14 86H200M14 8V86" class="m"/><path d="M14 12 C40 50 60 58 90 62 S160 66 200 67" class="a" stroke-width="2.5"/><text x="20" y="98">Day 1</text><text x="200" y="98" text-anchor="end">Day 30</text><text x="196" y="58" text-anchor="end">28% stay</text>`));
D('met','Net Promoter Score (NPS)',"Asks 'How likely are you to recommend us?' from 0 to 10. Score = % promoters (9–10) minus % detractors (0–6).",
 K(T('How likely are you to recommend us?','lbl')+`<span class="mnps">${Array.from({length:11},(_,i)=>`<i class="${i<=6?'det':i<=8?'pas':'pro'} ${i===9?'on':''}">${i}</i>`).join('')}</span>`,8));
D('met','Customer satisfaction (CSAT)',"A quick rating of how satisfied someone is with an interaction, usually on a 1–5 scale.",
 KC(T('How was your delivery?','lbl')+R(['frown','meh','smile','smile','smile'].map((f,i)=>`<span class="mface ${i===3?'on':''}">${ic(f,20)}</span>`).join(''),6),8));
D('met','System Usability Scale (SUS)',"A standard 10-question survey that produces a usability score out of 100. Around 68 is average.",
 KC(SVG(150,84,`<path d="M15 76A60 60 0 01135 76" class="m" stroke-width="10"/><path d="M15 76A60 60 0 01110 27" class="a" stroke-width="10"/><text x="75" y="70" text-anchor="middle" class="big">74</text>`)+T('above the 68 average','help'),2));
D('met','Task success rate',"The percentage of participants who complete a task correctly.",
 KC(R([1,1,1,1,0].map(s=>CIRC(ic(s?'check':'x',12),s?'ok':'bad')).join(''),6)+T('4 of 5 completed: 80%','help'),8));
D('met','Time on task',"How long it takes someone to complete a task. Shorter usually means easier.",
 KC(R(ic('clock',26)+T('1:42','num'),8)+T('average time to send money','help'),6));
D('met','Click-through rate (CTR)',"The percentage of people who click a link, ad or button after seeing it.",
 KC(R(KC(ic('eye',22)+T('1,000 saw it','help'),4)+AR()+KC(ic('cursor',20)+T('40 clicked','help'),4),12)+T('CTR = 4%','num-sm'),8));
D('met','Key performance indicator (KPI)',"A number that shows whether a team or product is hitting an important goal.",
 C(K(T('Monthly active users','tiny')+R(T('48.2k','num')+PILL(ic('au',9)+' 12%'),8)+BARS([40,46,44,55,60,70,78],[],34,10),5),'padding:10px 12px'));
D('met','North Star metric',"The single measure that best captures the value a product delivers to its customers.",
 KC(`<span style="color:var(--warn)">${ic('starf',30)}</span>`+T('Weekly transfers completed','lbl')+T('one metric the whole team rallies around','help'),5));
D('met','Engagement',"How actively and often people interact with a product, measured by things like sessions, actions or time spent.",
 KC(R(['M','T','W','T','F','S','S'].map((d,i)=>KC(`<i class="meng" style="height:${[30,46,40,60,54,24,18][i]}px"></i>`+T(d,'tiny'),3)).join(''),6,'align-items:flex-end')+T('sessions per day','help'),6));

/* ===== Visual Design & Type ===== */
D('vis','Visual hierarchy',"Using size, color, weight and placement so the most important things are seen first.",

 C(`<div class="mws">${L(70,'d big')}${L(90)}${B('Continue','p sm')}<i class="g t"></i><i class="g b"></i><i class="g l"></i><i class="g r"></i></div>`,'padding:0'));
D('vis','Grid system',"Invisible columns that align content consistently across a layout.",
 WN(`<div class="mgrid c4">${'<i></i>'.repeat(4)}</div>`+R(IM(84,40)+K(L(60,'d')+L(80),5),10)+R(IM(40,24)+IM(40,24)+IM(40,24)+IM(40,24),8)));
D('vis','Gutter',"The space between the columns of a grid.",
 KC(`<div class="mgrid g">${'<i></i>'.repeat(4)}</div>`+NT('↔ gutter'),6));
D('vis','Margin',"Space outside an element that pushes it away from its neighbors.",
 `<div class="mbox m"><span>Card</span><em class="t">16</em><em class="l">16</em></div>`);
D('vis','Padding',"Space inside an element, between its edge and its content.",
 `<div class="mbox p"><span>Button</span><em class="t">12</em><em class="l">24</em></div>`);
D('vis','8-point grid',"Sizing and spacing everything in multiples of 8 (8, 16, 24, 32…) so layouts stay consistent.",
 R([8,16,24,32,48].map(s=>KC(`<i class="m8" style="width:${s}px;height:${s}px"></i>`+T(s,'mono'),5)).join(''),12,'align-items:flex-end'));
D('vis','Alignment',"Lining elements up along a shared edge or center so the layout feels orderly.",

D('vis','Contrast',"The difference between elements, in color, size or weight, that makes them distinct and readable.",
 R(KC(`<span class="mcon lo">Aa</span>`+T('low','help'),4)+KC(`<span class="mcon hi">Aa</span>`+T('high','help'),4),18));
D('vis','Typography',"The style and arrangement of text so it's readable, clear and fits the brand.",
 R(T('Aa','ty1')+T('Aa','ty2')+T('Aa','ty3'),16));
D('vis','Typeface vs font',"A typeface is the design family (like Helvetica). A font is one specific style of it (like Helvetica Bold 16).",
 R(KC(T('Aa','ty2')+T('typeface: the family','help'),4)+KC(T('<b>Aa</b>','ty2')+T('font: Bold 16','help'),4),20));
D('vis','Serif',"Typefaces with small strokes, called serifs, at the ends of letters. Often feel classic or editorial.",
 KC(`<span class="mserif">Ag</span>`+NT('serifs'),4));
D('vis','Sans serif',"Typefaces without serifs at the ends of letters. Clean and common on screens.",
 KC(`<span class="msans">Ag</span>`+T('no end strokes','help'),4));
D('vis','Font weight',"How thick or thin the letters are, from Thin (100) to Black (900).",
 R([300,400,600,800].map(w=>KC(`<span class="mfw" style="font-weight:${w}">Aa</span>`+T(w,'mono'),3)).join(''),12));
D('vis','Line height',"The vertical space from one line of text to the next. Also called leading.",
 `<div class="mlh"><p>Good line height makes paragraphs easier to read.</p><em>1.5×</em></div>`);
D('vis','Letter spacing',"Adding or removing the same amount of space between all letters in a word. Also called tracking.",
 K(T('TRACKING','trk0')+T('TRACKING','trk1')+T('T R A C K I N G','trk2'),6));
D('vis','Kerning',"Adjusting the space between two specific letters, like A and V, so they look evenly spaced.",
 R(KC(`<span class="mkern loose">AV</span>`+T('unkerned','help'),4)+KC(`<span class="mkern">AV</span>`+T('kerned','help'),4),20));
D('vis','Type scale',"A set of text sizes that relate to each other by a ratio, used consistently across a product.",
 K([[30,'Display'],[22,'Heading'],[16,'Body'],[12,'Caption']].map(([s,l])=>R(`<span class="mts" style="font-size:${s}px">${l}</span>`+T(s,'mono'),8,'align-items:baseline')).join(''),2));
D('vis','X-height',"The height of lowercase letters like x. A larger x-height usually reads better at small sizes.",

D('vis','Baseline',"The invisible line that letters sit on.",
 `<div class="mbl"><span>Typography</span><em>baseline</em></div>`);
D('vis','Line length',"How many characters fit on a line. About 45–75 characters is comfortable to read.",
 K(R(`<span class="mll ok">${'·'.repeat(18)}</span>`+T('45–75 ✓','mono'),8)+R(`<span class="mll bad">${'·'.repeat(36)}</span>`+T('120 ✗','mono'),8),8));
D('vis','Color palette',"The set of colors chosen for a product, usually primary, secondary, neutrals and status colors.",

D('vis','Accent color',"A color used sparingly to draw attention to key elements, like links or the main button.",

D('vis','Hue, saturation, brightness',"Hue is the color itself, saturation is how intense it is, and brightness is how light or dark.",

D('vis','Tint and shade',"A tint is a color mixed with white. A shade is a color mixed with black.",

D('vis','Semantic colors',"Colors that carry meaning, like green for success, amber for warnings and red for errors.",

D('vis','Gradient',"A smooth blend from one color to another.",
 `<span class="mgrad"></span>`);

/* ================= CHESS ================= */
TP='chess';
// POS({e4:'K', d5:'p'}) -> FEN rows (white = capitals)
const POS=m=>{const b=Array.from({length:8},()=>Array(8).fill('.'));Object.entries(m).forEach(([s,p])=>{b[8-(+s[1])][s.charCodeAt(0)-97]=p});return b.map(r=>r.join('').replace(/\.+/g,x=>x.length)).join('/')};
const MID={f:[1,6],r:[2,7]};
const ALLSQ=(f,sqs,k='g')=>Object.fromEntries(sqs.map(s=>[s,k]));
const START='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR';

/* ===== Pieces & Rules ===== */
D('ch-pc','King',"The most important piece. It moves one square in any direction, and if it is trapped in checkmate the game is over.",
 BOARD(POS({d4:'K'}),{f:[1,5],r:[2,6],hl:ALLSQ(0,['c3','c4','c5','d3','d5','e3','e4','e5'])}));
D('ch-pc','Queen',"The most powerful piece. It moves any number of squares in a straight line or along a diagonal.",
 BOARD(POS({d4:'Q'}),{ar:[['d4','d8'],['d4','h4'],['d4','h8'],['d4','a1'],['d4','a4'],['d4','g1']],s:19}));
D('ch-pc','Rook',"A piece that moves any number of squares straight along a row (rank) or column (file).",
 BOARD(POS({d4:'R'}),{ar:[['d4','d8'],['d4','d1'],['d4','a4'],['d4','h4']],s:19}));
D('ch-pc','Bishop',"A piece that moves any number of squares diagonally, so it always stays on squares of one colour.",
 BOARD(POS({d4:'B'}),{ar:[['d4','h8'],['d4','a7'],['d4','a1'],['d4','g1']],s:19}));
D('ch-pc','Knight',"A piece that moves in an L-shape (two squares one way, one square sideways) and is the only piece that can jump over others.",
 BOARD(POS({d4:'N',c4:'P',d5:'p',e3:'P'}),{f:[1,5],r:[2,6],hl:ALLSQ(0,['b3','b5','c2','c6','e2','e6','f3','f5'])}));
D('ch-pc','Pawn',"Moves one square forward (two on its first move) but captures one square diagonally forward.",
 BOARD(POS({e4:'P',d5:'p'}),{f:[2,6],r:[3,6],ar:[['e4','e5','g'],['e4','d5','r']]}));
D('ch-pc','Check',"When a king is under attack. The player must get out of check straight away.",

/* ================= UX/UI INTERVIEWS (question → model answer) ================= */
TP='ivw';
const Q=(c,q,a)=>D(c,q,a,'');

/* ===== About You ===== */
Q('iv-you','Tell me about yourself.',
"Give a 60–90 second story, not your whole CV.\n\n- Who you are: your role and years of experience\n- What you focus on: the kind of products and problems you love\n- One proud result, with a number if you have one\n- Why this role is the natural next step\n\nTip: end on why you're excited about them, so it flows into the conversation.");
Q('iv-you','Why do you want to work here?',
"Show you've done your homework and that the fit goes both ways.\n\n- Something specific about their product or users that you admire\n- A problem they're facing that matches your skills\n- How the team, culture or stage fits how you work best\n\nTip: avoid generic praise. Name a feature, a launch or a value from their own site.");
Q('iv-you','Why are you leaving your current role?',
"Stay positive and forward-looking. Never criticise your current employer.\n\n- Focus on what you're moving towards: more ownership, a new domain, bigger impact\n- Mention what you've achieved and learned where you are\n- Link it back to what this role offers\n\nExample: \"I've grown a lot shipping features end to end, and now I want to work on a product at a larger scale.\"");
Q('iv-you','What is your biggest strength as a designer?',
"Pick one strength that matters for this role and prove it with a story.\n\n- Name it clearly: for example, turning messy problems into simple flows\n- Give a real example of when it made a difference\n- Share the result: a metric, user feedback or a team win\n\nTip: one strength with evidence beats a list of adjectives.");
Q('iv-you','What is your biggest weakness?',
"Choose a real but manageable weakness, and show how you're working on it.\n\n- Be honest: for example, over-polishing visuals too early\n- Explain the impact it had\n- Describe the habit you've built to manage it, like time-boxing exploration\n\nAvoid fake weaknesses like \"I'm a perfectionist\" with no follow-up.");
Q('iv-you','Where do you see yourself in five years?',
"Show ambition that fits the company, without sounding like you'll leave soon.\n\n- The skills you want to deepen: research, systems, leadership\n- The kind of impact you want: owning a product area, mentoring others\n- How this role is a step on that path\n\nIt's fine not to know a job title. Talk about growth and impact.");
Q('iv-you','How do you stay up to date with design?',
"Show curiosity with specific habits, not vague claims.\n\n- Sources you actually use: newsletters, podcasts, communities\n- How you practise: side projects, redesign challenges, new tools\n- Something recent you learned and applied at work\n\nTip: name one trend you're sceptical about too. It shows judgement.");
Q('iv-you','What does good design mean to you?',
"Give a clear point of view in a sentence, then back it up.\n\n- For example: good design solves a real problem so simply that people don't notice the design\n- Mention usefulness, usability, accessibility and craft\n- Give an everyday product you admire and why\n\nTip: connect your answer to the company's users.");
Q('iv-you','Which product do you admire, and why?',
"Pick a product you genuinely use and go beyond \"it looks nice.\"\n\n- The problem it solves and who for\n- One specific design decision that works well\n- One thing you'd improve, and how you'd test it\n\nThis shows taste, critical thinking and a design-thinking habit.");
Q('iv-you','Why did you become a UX/UI designer?',
"Tell a short, genuine story about what pulled you in.\n\n- The moment or project that sparked it\n- What keeps you motivated: solving problems for real people\n- How your background (even a different field) makes you a better designer\n\nTip: career changers, turn your past into a strength, like architecture training in space and people.");

/* ===== Process & Methods ===== */
Q('iv-prc','Walk me through your design process.',
"Show a flexible process, not a rigid recipe.\n\n- Understand: goals, users, constraints, success metrics\n- Research: talk to users, review data, look at competitors\n- Define: frame the problem and prioritise\n- Ideate and design: sketch, wireframe, then high fidelity\n- Test and iterate: usability tests, then ship and measure\n\nTip: say how you adapt it to deadlines, with a real example.");
Q('iv-prc','How do you start a new project?',
"Start by understanding before designing.\n\n- Meet stakeholders to learn the goal, scope and constraints\n- Agree on how success will be measured\n- Gather what's already known: research, analytics, support tickets\n- Identify the biggest unknowns and plan how to answer them\n\nTip: mention writing a short brief or problem statement everyone agrees on.");
Q('iv-prc','How do you do user research with little time or budget?',
"Show you can still learn fast and cheaply.\n\n- Guerrilla tests: 5 quick sessions with real or close-to-real users\n- Use existing data: analytics, reviews, support tickets, sales calls\n- Remote unmoderated tests or short surveys\n- Test the riskiest assumption first\n\nTip: \"Five users find most of the big usability problems\" is a well-known rule of thumb.");
Q('iv-prc','How do you decide which features to prioritise?',
"Balance user value, business value and effort.\n\n- Tie each idea to a user problem and a business goal\n- Use a simple framework: impact vs effort, or RICE\n- Involve engineering early for effort estimates\n- Start with the smallest version that tests the idea\n\nTip: give an example where you cut scope and still hit the goal.");
Q('iv-prc','How do you measure whether a design was successful?',
"Agree on success before designing, then check after launch.\n\n- Behaviour metrics: task success, conversion, retention, time on task\n- Attitude metrics: satisfaction, NPS, user quotes\n- Qualitative checks: usability tests and interviews\n- Compare against a baseline, or run an A/B test\n\nTip: share a real before-and-after number if you have one.");
Q('iv-prc','How do you run a usability test?',
"Show you can plan, run and act on a test.\n\n- Define what you want to learn and pick realistic tasks\n- Recruit around 5 people who match your users\n- Ask them to think aloud; don't lead or help\n- Note where they struggle and how often\n- Turn findings into prioritised fixes and share them\n\nTip: mention one surprising thing a test taught you.");
Q('iv-prc','What is the difference between UX and UI?',
"Keep it simple and show they work together.\n\n- UX (user experience) is the whole experience: the problem, flows, structure and how it feels to use\n- UI (user interface) is what people see and touch: layout, type, colour, components\n- Good UI on a bad UX still fails, and a great flow can be ruined by a confusing UI\n\nAnalogy: UX is the route; UI is the road signs and surface.");
Q('iv-prc','How do you design for accessibility?',
"Treat accessibility as part of the job, not an extra.\n\n- Colour contrast that meets WCAG AA\n- Text that scales; touch targets at least 44px\n- Never rely on colour alone to show meaning\n- Labels for screen readers and full keyboard support\n- Test with real assistive tech when possible\n\nTip: mention a time accessibility improved the product for everyone.");
Q('iv-prc','How do you work with a design system?',
"Show you use it, improve it and know when to break it.\n\n- Start from existing components and tokens for speed and consistency\n- Spot gaps and propose new components with clear guidance\n- Work with engineering so design and code stay in sync\n- Only break the system on purpose, and document why\n\nTip: mention a component you created or improved.");
Q('iv-prc','When would you choose low-fidelity over high-fidelity designs?',
"Match fidelity to the question you're trying to answer.\n\n- Low fidelity (sketches, wireframes): early ideas, flows, fast feedback, cheap to throw away\n- High fidelity: visual details, final usability checks, handoff\n- Moving to high fidelity too early makes people comment on colours instead of the idea\n\nTip: say you often test flows in low fidelity first.");
Q('iv-prc','How do you handle a project with unclear requirements?',
"Show that you create clarity instead of waiting for it.\n\n- Ask questions to find the real goal behind the request\n- Write down assumptions and get them confirmed\n- Make quick, rough concepts to make the conversation concrete\n- Agree on a small first step and a check-in point\n\nTip: ambiguity is normal; your job is to reduce it.");
Q('iv-prc','How do you use data in your design decisions?',
"Use data to inform decisions, not to replace judgement.\n\n- Quantitative data shows what is happening (drop-offs, clicks)\n- Qualitative research shows why it happens\n- Combine both before deciding, then measure after launch\n\nExample: analytics showed a 40% drop at checkout; interviews revealed surprise fees; showing costs earlier fixed it.");

/* ===== Portfolio & Case Studies ===== */
Q('iv-port','Walk me through a project you are proud of.',
"Tell it as a story with a clear structure (problem → process → result).\n\n- Context: the product, users and your role\n- Problem: what was wrong and why it mattered\n- Process: key research insights and design decisions\n- Result: what changed, ideally with numbers\n- Reflection: what you'd do differently\n\nTip: keep it to about 5 minutes and let them ask follow-ups.");
Q('iv-port','What was your role on this project?',
"Be clear and honest about what you personally did.\n\n- Say \"I\" for your work and \"we\" for team work\n- Name the people you worked with: PM, engineers, researchers\n- Highlight decisions you drove and influence you had\n\nTip: interviewers check this to see your real level of ownership.");
Q('iv-port','What would you do differently if you did this project again?',
"Show self-awareness and growth.\n\n- One honest thing that didn't go well: for example, testing too late\n- What it cost the project\n- What you now do differently on new projects\n\nAvoid saying \"nothing.\" Reflection is a sign of seniority.");
Q('iv-port','Tell me about a design that failed.',
"Own it, explain what you learned, and show you recovered.\n\n- What you designed and what you expected\n- What actually happened: the data or feedback\n- Why it failed: a wrong assumption, rushed research\n- What you changed next and the result\n\nTip: interviewers care more about learning than about the failure.");
Q('iv-port','How did your research change the design?',
"Connect insight to decision clearly.\n\n- The key finding, with a quote or number\n- The design before, and what you changed because of it\n- The impact of that change\n\nExample: \"Users didn't trust the price, so we showed the total up front and checkout completion rose.\"");
Q('iv-port','How did you handle constraints on this project?',
"Show you can design well within limits.\n\n- Name the constraint: time, budget, tech, legal or brand\n- How you adapted: phased the scope, reused components, simplified\n- What you protected for users despite the limits\n\nTip: constraints often lead to better, simpler designs. Say so.");
Q('iv-port','How do you present your work to stakeholders?',
"Lead with the problem and the outcome, not the pixels.\n\n- Start with the goal and the user problem\n- Show the key decisions and why you made them\n- Bring evidence: research, data, test results\n- Ask for specific feedback, not \"any thoughts?\"\n\nTip: tailor the depth; executives want impact, engineers want detail.");
Q('iv-port','Show me an example of your visual design skills.',
"Pick work that shows craft and reasoning.\n\n- Talk through hierarchy, spacing, type and colour choices\n- Explain how the visuals support the user's goal\n- Mention how it works across screen sizes, themes and states\n\nTip: show one before-and-after polish story.");
Q('iv-port','How do you decide what goes in your portfolio?',
"Quality and relevance over quantity.\n\n- 3–4 strong case studies, each showing different skills\n- Projects that match the role you're applying for\n- Clear problem, process and outcome in every case study\n- Short, skimmable pages with strong visuals\n\nTip: one deep case study beats five galleries of screens.");
Q('iv-port','How do you handle work under a non-disclosure agreement (NDA)?',
"Respect the NDA and still show your thinking.\n\n- Remove names, data and confidential screens\n- Recreate key screens with dummy content, or describe the process\n- Offer to walk through it verbally in the interview\n\nTip: never share confidential work without permission, even in a private interview.");

/* ===== Collaboration ===== */
Q('iv-col','How do you work with developers?',
"Show partnership from the start, not just handoff at the end.\n\n- Involve engineers early to check feasibility and effort\n- Share clear specs: states, edge cases, spacing, tokens\n- Be available during the build and review it before release\n- Be open to technical trade-offs\n\nTip: mention a time an engineer's idea improved your design.");
Q('iv-col','How do you work with product managers?',
"Show you're aligned on goals while bringing the user's voice.\n\n- Agree on the problem, goals and success metrics together\n- Share research early so decisions are based on evidence\n- Discuss trade-offs openly: scope, time, quality\n\nTip: PMs own the \"what and why\"; designers shape the \"how,\" and both overlap a lot.");
Q('iv-col','How do you handle disagreement about a design?',
"Stay curious, use evidence, and focus on the user.\n\n- Listen first and understand their concern\n- Bring data, research or principles, not opinions\n- Suggest a test when it's genuinely unclear\n- Disagree and commit once a decision is made\n\nTip: give a real example with a calm, respectful outcome.");
Q('iv-col','How do you take feedback on your work?',
"Show you welcome it and know how to use it.\n\n- Separate the work from yourself\n- Ask questions to find the problem behind the suggestion\n- Thank people, then decide what to act on based on goals\n- Close the loop: show what changed\n\nTip: \"Feedback about what's not working is gold; solutions are optional.\"");
Q('iv-col','How do you give feedback to other designers?',
"Be kind, specific and useful.\n\n- Start with the goal of the design\n- Point to specific moments: \"this button is easy to miss\"\n- Explain why it matters for users\n- Ask questions instead of dictating\n\nTip: mention design critiques you've run or joined.");
Q('iv-col','How do you handle tight deadlines?',
"Show calm prioritisation, not heroics.\n\n- Clarify what really has to ship now\n- Cut scope rather than quality on the core flow\n- Reuse patterns and components\n- Communicate risks early and plan follow-up improvements\n\nTip: give an example where you shipped a smaller version on time.");
Q('iv-col','How do you advocate for users when the business disagrees?',
"Speak the business's language.\n\n- Frame user problems as business risks: churn, support costs, lost sales\n- Bring evidence: quotes, clips, numbers\n- Offer options with trade-offs, not ultimatums\n- Propose a small test to settle it\n\nTip: good advocacy is persuasion, not stubbornness.");
Q('iv-col','Tell me about a time you worked with a difficult stakeholder.',
"Use the STAR format: Situation, Task, Action, Result.\n\n- Situation: who it was and the tension, kept neutral\n- Task: what needed to happen\n- Action: how you built trust, by listening, involving them and showing evidence\n- Result: the outcome and the better relationship\n\nTip: never paint the other person as the villain.");
Q('iv-col','How do you work in a remote team?',
"Show clear communication habits.\n\n- Over-communicate decisions in writing\n- Share work early in shared files or recorded walkthroughs\n- Use async updates and keep meetings focused\n- Make time for informal connection\n\nTip: name the tools you use: Figma comments, Loom, Slack, Notion.");
Q('iv-col','How do you onboard into a new product quickly?',
"Show a learning plan.\n\n- Use the product yourself as a new user\n- Read past research, analytics and support tickets\n- Meet key people across product, engineering, support and sales\n- Ship a small improvement early to learn the process\n\nTip: a 30-60-90 day mindset impresses hiring managers.");

/* ===== Design Challenges ===== */
Q('iv-chl','How would you approach a whiteboard design challenge?',
"Think out loud and follow a clear structure.\n\n- Clarify: who the user is, the goal, constraints, the platform\n- Define: pick one key problem to focus on\n- Explore: sketch a few quick ideas\n- Decide: choose one and explain why\n- Detail: the main flow and screens\n- Reflect: how you'd test and measure it\n\nTip: ask questions first; jumping to screens is the most common mistake.");
Q('iv-chl','Design an alarm clock app for a person who is blind.',
"Start with questions and the user's real needs.\n\n- Clarify: phone or device, voice assistants, the main daily routine\n- Key needs: setting alarms without seeing the screen, confirming they're set\n- Ideas: voice set-up, strong haptic patterns, full screen-reader labels, simple large gestures\n- Edge cases: snoozing, a dead battery, multiple alarms\n- Test with blind users and accessibility experts\n\nTip: show empathy and practicality, not flashy visuals.");
Q('iv-chl','How would you improve the checkout of an online store?',
"Find the problem before proposing fixes.\n\n- Ask what the data shows: where do people drop off?\n- Common issues: surprise costs, forced sign-up, long forms, few payment options\n- Ideas: guest checkout, show the total early, autofill, progress steps, trust signals\n- Measure: checkout completion rate, time to complete\n\nTip: in Nigeria and many markets, offering bank transfer and pay-on-delivery can matter a lot.");
Q('iv-chl','Redesign a product you use every day.',
"Pick something simple and show your thinking, not just new visuals.\n\n- The product and who uses it\n- One real pain point you've noticed, and evidence others have it too\n- Two or three ideas, then your chosen solution\n- How you'd test it and what metric should move\n\nTip: respect the original team's constraints; they likely had reasons.");
Q('iv-chl','How would you design onboarding for a new app?',
"Get people to value fast, with as little friction as possible.\n\n- Define the \"aha moment\": the first time the app proves useful\n- Remove steps: delay sign-up, ask only essential questions\n- Show, don't tell: interactive first tasks beat long tutorial screens\n- Personalise gently based on the user's goal\n- Measure: activation rate and day-7 retention");
Q('iv-chl','Users are dropping off at sign-up. What do you do?',
"Investigate, form hypotheses, then test.\n\n- Look at the funnel: which step loses the most people?\n- Watch session recordings or run quick tests\n- Hypotheses: too many fields, unclear value, errors, slow codes\n- Fix the biggest one first: fewer fields, social sign-in, clearer errors\n- A/B test and measure completion\n\nTip: say you'd check for a technical bug first; it's often the cause.");
Q('iv-chl','How would you design for a market with slow internet and low-end phones?',
"Design for real-world conditions.\n\n- Lightweight pages: fewer images, compressed assets\n- Offline support and saving progress\n- Clear loading states and retry options\n- Big touch targets and simple flows for small screens\n- Low data use, and SMS or USSD fallbacks where relevant\n\nTip: test on an actual low-end device with a throttled network.");
Q('iv-chl','How would you design a dashboard for busy managers?',
"Start from the decisions they need to make.\n\n- Ask: what do they check daily, and what makes them act?\n- Show the few key numbers first, with trends and context\n- Highlight what needs attention: alerts and exceptions\n- Let them drill down for detail\n- Keep it scannable: clear hierarchy, sensible charts, minimal clutter\n\nTip: \"A dashboard should answer a question, not display every metric.\"");
Q('iv-chl','How would you improve the experience of a banking app?',
"Focus on trust, clarity and speed.\n\n- Research the top tasks: checking balance, transfers, bills\n- Make the top tasks one or two taps away\n- Clear confirmations and receipts build trust\n- Strong but low-friction security: biometrics, clear fraud alerts\n- Helpful errors when transfers fail, and what happens to the money\n\nTip: mention measuring task success and support-call volume.");
Q('iv-chl','You have one week to improve an app. What do you do?',
"Show prioritisation and speed.\n\n- Day 1: understand goals, data and the biggest complaints\n- Day 2: quick research, a few calls or tests\n- Day 3–4: design solutions for the highest-impact issue\n- Day 5: test with users and refine\n- Hand over a clear plan for the next steps\n\nTip: one well-solved problem beats ten half-solved ones.");

/* ===== Questions to Ask ===== */
Q('iv-ask','What questions should you ask about the team?',
"Good questions to understand how you'd work.\n\n- How is the design team structured, and who would I work with most?\n- How do designers, PMs and engineers make decisions together?\n- How is design feedback and critique run?\n\nTip: asking good questions shows you're interviewing them too.");
Q('iv-ask','What questions should you ask about the product?',
"Show curiosity about the users and the challenges.\n\n- Who are your most important users, and what do they struggle with?\n- What's the biggest product challenge for the next year?\n- How do you learn from users today?\n\nTip: refer to something you noticed while using their product.");
Q('iv-ask','What questions should you ask about success in the role?',
"Find out what's expected and how you'll be judged.\n\n- What would success look like in the first 3 to 6 months?\n- What's the biggest problem you'd want this person to solve?\n- How is design impact measured here?");
Q('iv-ask','What questions should you ask about growth?',
"Show you plan to grow with them.\n\n- How do designers grow here: is there a career path or levels?\n- Is there budget or time for learning and conferences?\n- Who would mentor me, or who would I mentor?");
Q('iv-ask','What questions should you ask about design maturity?',
"Learn how much the company values design.\n\n- At what stage does design get involved in projects?\n- Do you have a design system, and who maintains it?\n- How often do you run user research?\n\nTip: the answers tell you how much influence you'll really have.");
Q('iv-ask','What should you ask at the end of the interview?',
"Close strongly and clarify next steps.\n\n- Is there anything about my experience you'd like me to clarify?\n- What are the next steps, and when can I expect to hear back?\n\nThen thank them, and send a short thank-you note within 24 hours.");
Q('iv-ask','What questions should you avoid asking early on?',
"Some topics are better saved for later stages.\n\n- Leading with salary, perks or time off before showing interest in the work\n- Questions answered on their website's front page\n- Anything negative about other candidates or companies\n\nTip: salary is important; raise it with the recruiter at the right stage, not with the first interviewer.");

  const k=S.known.has(t.id), rose=k?ROSE:'';

// answers: blank line = new paragraph, lines starting with '- ' = bullet points
function paras(d){return esc(d).split(/\n\n+/).map(b=>/^- /m.test(b)?`<ul>${b.split(/\n/).map(l=>`<li>${l.replace(/^- /,'')}</li>`).join('')}</ul>`:`<p>${b.replace(/\n/g,'<br>')}</p>`).join('')}
// shrink the hero term until its longest word fits the card and the lines fit the height

function renderStudy(enter){

      ${active?`<div class="dk-count" aria-label="Card ${S.pos+1} of ${n}"><b><i></i><span class="${enter?'tick':''}">${num}</span></b><em>/ ${n}</em></div>`:''}

function hideHint(){if(S.hint)return;S.hint=true;persist();const h=$('#hint');if(h){h.classList.add('out');setTimeout(()=>h.remove(),400)}}
function flip(){const c=$('#card');if(!c||S.busy)return;S.flipped=!S.flipped;c.classList.toggle('flipped',S.flipped);c.querySelector('.front').setAttribute('aria-hidden',S.flipped);c.querySelector('.back').setAttribute('aria-hidden',!S.flipped);SFX.play('flip')}
function mark(kind,drag){
  const c=$('#card'); if(!c||S.busy) return;
  S.busy=true; hideHint();
  const id=S.order[S.pos], dir=kind==='know'?1:-1, had=S.known.has(id), before=xp();
  if(kind==='know') S.known.add(id); else S.known.delete(id);
  persist(); if(had!==S.known.has(id)) renderLevel(kind==='know');
  // drop any copy already queued to come back, then (for Still learning) queue it again after REPEAT cards
  for(let i=S.order.length-1;i>S.pos;i--) if(S.order[i]===id) S.order.splice(i,1);
  let gapBefore=-1;
  if(kind==='learn'){const at=Math.min(S.pos+1+REPEAT,S.order.length);S.order.splice(at,0,id);gapBefore=at-S.pos-1}
  if(kind==='know'){SFX.play('know');buzz(15)}else{SFX.play('learn');buzz(10)}
  track(kind==='know'?'card-know':'card-learn');S.marks++;
  c.classList.add(kind==='know'?'ok':'lt');
  const tag=c.querySelector('.dtag.'+kind); if(tag) tag.style.opacity=1;
  if(kind==='know'){const b=$('#knowb');if(b)b.classList.add('done')}
  const go=()=>{
    c.style.transition='transform .42s cubic-bezier(.55,0,.8,.35), opacity .42s';
    c.style.transform=`translate(${dir*(app.clientWidth+120)}px,${drag?drag.dy*.4:-20}px) rotate(${dir*24}deg)`;
    c.style.opacity='0';
    setTimeout(()=>{S.pos++;S.flipped=false;S.busy=false;renderStudy(true);
      if(gapBefore>=0) toast(gapBefore>=REPEAT?`We'll bring this back after ${REPEAT} cards`:gapBefore===0?"We'll show this one again next":`We'll bring this back at the end`,P.reset);
      if(S.pos>=S.order.length){track('deck-finished');setTimeout(()=>{burst(innerWidth/2,innerHeight*.35,150,1.5);SFX.play('fanfare')},200)}
      else if(S.marks>=20&&!S.fbNudge&&!S.fbDone&&gapBefore<0){S.fbNudge=true;persist();setTimeout(()=>{if(document.querySelector('.unlock')||sheetOpen){S.fbNudge=false;persist();return}fbRate=0;openSheet(feedbackHTML(0))},700)}
      checkBadge(before)},380);
  };
  drag?go():setTimeout(go,kind==='know'?260:120);
}
function bindCard(){
  const c=$('#card'); if(!c) return;
  let d=null;
  const tags=()=>[c.querySelector('.dtag.know'),c.querySelector('.dtag.learn')];
  c.addEventListener('pointerdown',e=>{if(e.button!==0||S.busy)return;d={x:e.clientX,y:e.clientY,dx:0,dy:0,moved:false,id:e.pointerId};c.style.transition='none'});
  c.addEventListener('pointermove',e=>{if(!d)return;d.dx=e.clientX-d.x;d.dy=e.clientY-d.y;
    if(!d.moved&&Math.abs(d.dx)>8&&Math.abs(d.dx)>Math.abs(d.dy)){d.moved=true;try{c.setPointerCapture(d.id)}catch(_){}}
    if(!d.moved)return;
    c.style.transform=`translate(${d.dx}px,${d.dy*.3}px) rotate(${d.dx*.05}deg)`;
    const [k,l]=tags();k.style.opacity=Math.max(0,Math.min(1,(d.dx-20)/90));l.style.opacity=Math.max(0,Math.min(1,(-d.dx-20)/90));
    c.classList.toggle('ok',d.dx>90);c.classList.toggle('lt',d.dx<-90)});
  const reset=()=>{c.style.transition='transform .5s cubic-bezier(.3,1.6,.5,1)';c.style.transform='';tags().forEach(t=>t.style.opacity=0);c.classList.remove('ok','lt')};
  c.addEventListener('pointerup',()=>{if(!d)return;const dd=d;d=null;
    if(!dd.moved){c.style.transition='';if(Math.abs(dd.dx)<8&&Math.abs(dd.dy)<8)flip();return}
    if(Math.abs(dd.dx)>100){mark(dd.dx>0?'know':'learn',dd);return}
    reset()});
  c.addEventListener('pointercancel',()=>{if(!d)return;d=null;reset()});
}

/* ---------- quiz ---------- */
const STOP=new Set(['about','their','other','where','which','with','that','this','from','your','user','users','design']);
function keywords(t){return [...new Set(t.t.replace(/[()]/g,' ').toLowerCase().split(/[\s–\-\/,]+/).map(w=>w.replace(/'s$/,'').replace(/[^a-zäöü0-9]/g,'')).filter(w=>w.length>=4&&!STOP.has(w)))]}
function maskDef(t){
  let d=esc(t.d);
  const parts=new Set([t.t,t.t.replace(/\s*\(.*?\)\s*/g,' ').trim()]);
  (t.t.match(/\((.*?)\)/g)||[]).forEach(p=>parts.add(p.slice(1,-1)));
  t.t.replace(/\(.*?\)/g,'').split(/[\s–\-\/]+/).forEach(w=>{w=w.replace(/'s$/,'').replace(/[^A-Za-zäöüÄÖÜ0-9]/g,'');if(w.length>=5&&!STOP.has(w.toLowerCase()))parts.add(w)});
  [...parts].filter(Boolean).sort((a,b)=>b.length-a.length).forEach(p=>{
    const re=new RegExp('(^|[^A-Za-z])('+p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?:\'s|s|es|ing|ed)?(?=$|[^A-Za-z])','gi');
    d=d.replace(re,(m,a)=>a+'<mark>term</mark>');
  });
  return d;
}
function newQuestion(){
  const pool=TERMS.filter(t=>S.cat==='all'||t.c===S.cat), Q=S.quiz;
  if(!pool.length){Q.cur=null;return}
  let cand=pool.filter(t=>!Q.recent.includes(t.id)); if(!cand.length) cand=pool;
  const t=cand[Math.random()*cand.length|0];
  Q.recent.push(t.id); if(Q.recent.length>Math.min(14,pool.length-1)) Q.recent.shift();
  const same=shuffle(TERMS.filter(x=>x.c===t.c&&x.id!==t.id)), other=shuffle(TERMS.filter(x=>x.c!==t.c&&x.id!==t.id));
  const opts=[t,...same.slice(0,3)]; while(opts.length<4) opts.push(other.pop());
  Q.cur=t.id; Q.opts=shuffle(opts.map(o=>o.id)); Q.answered=false; Q.pick=null;
}
function renderQuiz(){

  if(!Q.cur||!BYID[Q.cur]||BYID[Q.cur].tp!==S.topic||(S.cat!=='all'&&BYID[Q.cur].c!==S.cat)) newQuestion();
  const t=BYID[Q.cur];
  const title=S.cat==='all'?'Quiz':CATS[S.cat][0];
  const opt=(id,i)=>{const o=BYID[id];let cls='',mk='';
    if(Q.answered){if(id===t.id){cls='right';mk=I(P.check,13,3)}else if(id===Q.pick){cls='wrong';mk=I(P.x,12,3)}else cls='dim'}
    return `<button class="opt ${cls}" data-pick="${id}" ${Q.answered?'disabled':''} aria-label="${i+1}. ${esc(o.t)}"><span class="t">${esc(o.t)}</span><span class="k">${mk}</span></button>`};
  const ok=Q.answered&&Q.pick===t.id;
  main.innerHTML=`<section class="view v-quiz">
    <div class="ctx gut"><div><h2>Which term is this?</h2><p>${CATS[t.c][0]} · ${Q.score} of ${Q.total} right</p></div><span class="streak ${Q.streak&&Q.streak%5===0&&Q.answered?'hot':''}" aria-label="Streak ${Q.streak}"><b>${I(P.bolt,14)}</b>${Q.streak}</span></div>
    <div class="gut">
      <div class="qcard ${Q.answered&&!ok?'shake':''}">
        <div class="stage"><div class="vis">${t.v}</div></div>
        ${Q.answered?`<h3>${esc(t.t)}</h3><p>${esc(t.d)}</p>`:`<p class="q">${maskDef(t)}</p>`}
      </div>
      <div class="opts" role="group" aria-label="Answers">${Q.opts.map(opt).join('')}</div>
      ${Q.answered?`<div class="verdict ${ok?'ok':'no'}">${ok?I(P.check,18,2.6)+' Correct, +5 xp':I(P.x,18,2.6)+' Not quite. The answer is highlighted.'}</div><button class="pill dark full qnext" data-act="next">Next question</button>`:''}
    </div>
  </section>`;
  if(!Q.answered){const kws=keywords(t);main.querySelectorAll('.stage .mnt').forEach(el=>{const tx=el.textContent.toLowerCase();if(kws.some(k=>tx.includes(k)))el.textContent='?'})}

function pick(id){

function renderHome(){
  const x=xp(), i=badgeIdx(x), cur=BADGES[i], nxt=BADGES[i+1];
  const lo=cur?cur.xp:0, p=nxt?(x-lo)/(nxt.xp-lo):1;
  const acc=S.qa?Math.round(S.qc/S.qa*100)+'%':'–';
  const kn=tp=>topicTerms(tp).filter(t=>S.known.has(t.id)).length;
  const T0=TOPICS[S.topic], n0=TERMS.length, k0=kn(S.topic);
  const brow=(b,j)=>{const on=x>=b.xp, isNext=j===i+1;
    return `<div class="brow ${on?'on':''} ${isNext?'next':''}">${badgeSVG(b,on)}<div><b>${b.n}</b><p>${b.d}</p>${isNext?`<div class="bbar"><i style="width:${Math.max(3,(x-(cur?cur.xp:0))/(b.xp-(cur?cur.xp:0))*100)}%"></i></div><small>${b.xp-x} xp left to unlock</small>`:''}</div></div>`};
  const tile=tp=>{const T=TOPICS[tp],n=topicTerms(tp).length,k=kn(tp);
    return `<button class="tile" data-topic="${tp}" style="--c:${T.c}"><span class="tico">${I(P[T.i],20,2)}</span><b>${T.n}</b><small>${k} of ${n} ${T.qa?'answered':'known'}</small><span class="tbar"><i style="width:${k/n*100}%"></i></span></button>`};
  main.innerHTML=`<section class="view v-home gut">
    <h2 class="big" style="padding-left:0;padding-right:0">Your decks</h2>
    <div class="dhero" style="--c:${T0.c}">
      <div class="hrow"><span class="tico">${I(P[T0.i],22,2)}</span><span class="hl"><small>Continue</small><b>${T0.n}</b></span><span class="hn"><b>${Math.round(k0/n0*100)}%</b><small>${k0}/${n0}</small></span></div>
      <span class="tbar lg"><i style="width:${k0/n0*100}%"></i></span>
      <button class="pill dark full" data-tabgo="study">${k0?'Continue studying':'Start studying'}</button>
    </div>
    <div class="tiles">${Object.keys(TOPICS).filter(tp=>tp!==S.topic).map(tile).join('')}</div>
    <div class="pcard lv">
      ${badgeSVG(cur||BADGES[0],!!cur)}
      <div><div class="pname">${cur?cur.n:'No badge yet'}</div><div class="xprow"><span>${x} xp · ${S.known.size} cards known</span><span>${nxt?`${nxt.xp-x} to next`:'Top badge'}</span></div><span class="tbar"><i style="width:${p*100}%;background:var(--green)"></i></span></div>
    </div>
    <p class="label">${T0.s} by category</p>
    <div class="list">${topicCats().map(c=>{const k=TERMS.filter(t=>t.c===c&&S.known.has(t.id)).length;return `<button class="lrow" data-studycat="${c}" style="--c:${col(c)}"><span class="ico"><i></i></span><span><b>${CATS[c][0]}</b><small>${k} of ${CNT[c]} known</small></span><span class="rt"><span class="mini"><i style="width:${k/CNT[c]*100}%"></i></span></span></button>`}).join('')}</div>
    <p class="label">Badges</p>
    <div class="badges">${BADGES.map(brow).join('')}</div>
    <p class="label">Quiz</p>
    <div class="stats"><div><small>Answered</small><b>${S.qa}</b></div><div><small>Accuracy</small><b>${acc}</b></div><div><small>Best streak</small><b>${S.best}</b></div></div>
    <p class="label">Settings</p>
    <div class="list">
      <button class="lrow" data-act="feedback"><span class="ico">${I(P.chat,18,2)}</span><span><b>Send feedback</b><small>Tell us what to improve</small></span><span class="rt">${I(P.chev,18,2)}</span></button>
      <button class="lrow" role="switch" data-act="sound" aria-checked="${S.sound}"><span class="ico">${I(P.sound,18,2)}</span><span><b>Sound effects</b><small>Playful sounds as you study</small></span><span class="rt"><span class="sw"></span></span></button>
      <button class="lrow danger" data-act="askreset"><span class="ico">${I(P.reset,18,2)}</span><span><b>Reset progress</b><small>Clears known cards, xp and badges on this device</small></span><span class="rt">${I(P.chev,18,2)}</span></button>
      ${S.resetAsk?`<div class="confirm"><button class="pill out sm" data-act="noreset">Cancel</button><button class="pill red sm" data-act="doreset">Yes, reset</button></div>`:''}
    </div>
    <p class="privacy">We count anonymous usage (no names, no tracking cookies) to make Flashdecks better. Your progress stays on this device.</p>
    <p class="aiwarn">Card content was written with the help of AI and may contain mistakes. Double-check anything important.</p>
  </section>`;
}

/* ---------- filter sheet ---------- */
function filterHTML(){
  const base=TERMS.filter(t=>S.cat==='all'||t.c===S.cat), k=base.filter(t=>S.known.has(t.id)).length;
  const seg=[['all','All',base.length],['learning','Learning',base.length-k],['known','Known',k]];
  return `<div class="shead"><h3>Choose cards</h3><button class="link" data-act="close">Done</button></div>
  ${S.tab==='study'?`<p class="slabel">Show</p><div class="seg">${seg.map(([v,l,n])=>`<button data-deck="${v}" aria-pressed="${S.deck===v}">${l}<small>${n}</small></button>`).join('')}</div>`:''}
  <p class="slabel">Category</p>
  <div class="box">${[['all','All categories',TERMS.length,'var(--ink)'],...topicCats().map(c=>[c,CATS[c][0],CNT[c],col(c)])].map(([c,l,n,cl])=>`<button class="crow" data-fcat="${c}" aria-pressed="${S.cat===c}" style="--c:${cl}"><span class="sq"><i></i></span><span>${l}</span><small>${n}</small><span class="ck">${I(P.check,20,2.6)}</span></button>`).join('')}</div>
  ${S.tab==='study'?`<p class="slabel">Options</p><div class="box">
    <button class="trow" role="switch" data-opt="shuffle" aria-checked="${S.shuffle}"><span>Shuffle cards</span><span class="sw"></span></button>
    ${hasArt()?`<button class="trow" role="switch" data-opt="pic" aria-checked="${S.pic}"><span>Show the picture first</span><span class="sw"></span></button>`:''}
  </div>`:''}`;
}

/* ---------- sheet + overlays ---------- */
let sheetOpen=false;
function openSheet(html){
  closeOverlays(true);
  const sc=document.createElement('div');sc.className='scrim';sc.dataset.act='close';
  const sh=document.createElement('div');sh.className='sheet';sh.setAttribute('role','dialog');sh.setAttribute('aria-modal','true');
  sh.innerHTML=`<i class="grab"></i><div class="sbody gut">${html}</div>`;
  app.append(sc,sh);sheetOpen=true;
  requestAnimationFrame(()=>{sc.classList.add('on');sh.classList.add('on');fit();const f=sh.querySelector('button');if(f)f.focus({preventScroll:true})});
  let y0=null;
  sh.querySelector('.grab').addEventListener('pointerdown',e=>{y0=e.clientY});
  sh.addEventListener('pointerup',e=>{if(y0!==null&&e.clientY-y0>60)closeSheet();y0=null});
}
function refreshSheet(html){const b=document.querySelector('.sheet .sbody');if(b){b.innerHTML=html;fit()}}
function closeSheet(){
  const sc=document.querySelector('.scrim'),sh=document.querySelector('.sheet');if(!sh)return;
  sheetOpen=false;sc.classList.remove('on');sh.classList.remove('on');
  setTimeout(()=>{sc.remove();sh.remove()},400);
}
function closeOverlays(now){document.querySelectorAll('.scrim,.sheet').forEach(e=>now?e.remove():null);if(now)sheetOpen=false}
function checkBadge(before){
  const i=badgeIdx(xp());
  if(i>S.seen){S.seen=i;persist();const b=BADGES[i];
    setTimeout(()=>{
      const o=document.createElement('div');o.className='unlock';o.setAttribute('role','dialog');o.setAttribute('aria-label','Badge unlocked');
      o.innerHTML=`<div class="box2">${badgeSVG(b,true)}<small>Badge unlocked</small><h3>${b.n}</h3><p>${b.d}</p><button class="pill dark full" data-act="closeunlock">Keep going</button></div>`;
      app.append(o);o.querySelector('button').focus({preventScroll:true});
      burst(innerWidth/2,innerHeight*.4,160,1.5); SFX.play('fanfare');
    },450);
  } else if(i<S.seen){S.seen=i;persist()}
}

/* ---------- feedback + usage (fill these two in) ---------- */
const FEEDBACK_URL='https://script.google.com/macros/s/AKfycbx6v7VYfC6why5SN0E6WbUQiTIk12uYzugOVJWEeTNzmA6yre-4ujeeofEf5TQ4uYHA/exec';          // Google Apps Script web app URL (ends in /exec)
const GOATCOUNTER='dvn019';           // GoatCounter site code, e.g. "uxlexicon"
const track=(name,title)=>{try{if(window.goatcounter&&goatcounter.count)goatcounter.count({path:name,title:title||name,event:true})}catch(e){}};
const trackView=tab=>{try{if(window.goatcounter&&goatcounter.count)goatcounter.count({path:'/'+tab,title:tab})}catch(e){}};
if(GOATCOUNTER&&/^https?:$/.test(location.protocol)){window.goatcounter={no_onload:true};const g=document.createElement('script');g.async=true;g.src='https://gc.zgo.at/count.js';
  g.dataset.goatcounter=`https://${GOATCOUNTER}.goatcounter.com/count`;g.onload=()=>trackView(S.tab);document.head.appendChild(g)}
const FACES=['😞','🙁','😐','🙂','😍'];
function feedbackHTML(r){return `<div class="shead"><h3>Send feedback</h3><button class="link" data-act="close">Close</button></div>
  <p class="slabel">How are you finding Flashdecks?</p>
  <div class="rate">${FACES.map((f,i)=>`<button type="button" data-rate="${i+1}" aria-label="${i+1} of 5" aria-pressed="${r===i+1}">${f}</button>`).join('')}</div>
  <p class="slabel">What would make it better?</p>
  <textarea class="fb" id="fbtext" rows="4" maxlength="2000" placeholder="A missing term, a bug, an idea…"></textarea>
  <p class="slabel">Email <small>(optional, if you'd like a reply)</small></p>
  <input class="fb" id="fbmail" type="email" maxlength="200" placeholder="you@example.com" autocomplete="email">
  <button class="pill dark full fbsend" data-act="sendfb">Send feedback</button>`}
let fbRate=0;
async function sendFeedback(){
  const text=$('#fbtext').value.trim(), email=$('#fbmail').value.trim();
  if(!fbRate&&!text){toast('Pick a face or write a note first');return}
  const btn=$('.fbsend');btn.disabled=true;btn.textContent='Sending…';
  const body={rating:fbRate||'',text,email,known:S.known.size,device:`${innerWidth}×${innerHeight} · ${navigator.userAgent}`.slice(0,200),page:S.tab};
  try{
    if(!FEEDBACK_URL) throw new Error('no url');
    await fetch(FEEDBACK_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
    S.fbDone=true;persist();closeSheet();track('feedback-sent');SFX.play('know');toast('Thanks! Your feedback was sent');fbRate=0;
  }catch(e){btn.disabled=false;btn.textContent='Send feedback';toast("Couldn't send. Check your connection")}
}
/* ---------- render ---------- */
function render(enter){
  renderTabs();
  if(S.tab==='study') renderStudy(enter);
  else if(S.tab==='quiz') renderQuiz();
  else if(S.tab==='browse') renderBrowse();
  else renderHome();
}
function go(tab){if(S.tab===tab){main.scrollTo({top:0,behavior:reduced?'auto':'smooth'});return}S.tab=tab;S.resetAsk=false;persist();SFX.play('tick');trackView(tab);closeSheet();main.scrollTop=0;render()}

/* ---------- confetti ---------- */
const cv=$('#confetti'), cx=cv.getContext('2d'); let parts=[], raf=0;
function burst(x,y,n=60,sp=1){
  if(reduced) return;
  const cols=['#00A35C','#1F7AE0','#F5A524','#E5484D','#7C5CFF','#22C179'];
  const dpr=devicePixelRatio||1; if(cv.width!==Math.round(innerWidth*dpr)){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr}
  for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*Math.PI*(sp>1?1.4:1),v=(4+Math.random()*8)*sp;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:5+Math.random()*6,h:3+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length],t:0,s:Math.random()<.35})}
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(){
  const dpr=devicePixelRatio||1; cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.y<innerHeight+30&&p.t<220);
  for(const p of parts){p.t++;p.vy+=.28;p.vx*=.985;p.vy*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.max(0,1-p.t/220);cx.fillStyle=p.c;
    if(p.s){cx.beginPath();cx.arc(0,0,p.h*.7,0,7);cx.fill()}else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.t*.12))+1);cx.restore()}
  raf=parts.length?requestAnimationFrame(tick):(cx.clearRect(0,0,innerWidth,innerHeight),0);
}
let tt=0;
function toast(msg,icon){const t=$('#toast');t.innerHTML=(icon?`<b>${I(icon,15,2.4)}</b>`:'')+`<span>${esc(msg)}</span>`;
  // on Study, overlap the card's bottom edge, keeping 14px clear of the buttons (the card moves with screen height)
  const st=S.tab==='study'&&$('#stack');
  t.style.bottom=st?Math.max(12,app.getBoundingClientRect().bottom-st.getBoundingClientRect().bottom-10)+'px':'';
  t.classList.toggle('with-icon',!!icon);t.classList.remove('on');void t.offsetWidth;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------- events ---------- */
$('.tabbar').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)go(b.dataset.tab)});
$('#lvl').addEventListener('click',()=>go('home'));
app.addEventListener('click',e=>{
  const t=e.target;
  const pk=t.closest('[data-pick]'); if(pk){pick(pk.dataset.pick);return}
  const op=t.closest('[data-open]'); if(op){openDetail(op.dataset.open);return}
  const tg=t.closest('[data-tabgo]'); if(tg){go(tg.dataset.tabgo);return}
  const tp=t.closest('[data-topic]'); if(tp){setTopic(tp.dataset.topic);S.first=true;go('study');return}
  const sc=t.closest('[data-studycat]'); if(sc){S.cat=sc.dataset.studycat;S.deck='all';persist();rebuild();S.quiz.cur=null;go('study');return}
  const fc=t.closest('[data-fcat]'); if(fc){S.cat=fc.dataset.fcat;persist();rebuild();S.quiz.cur=null;refreshSheet(filterHTML());render(true);return}
  const dk=t.closest('[data-deck]'); if(dk){S.deck=dk.dataset.deck;persist();rebuild();refreshSheet(filterHTML());render(true);return}
  const opt=t.closest('[data-opt]'); if(opt){const k=opt.dataset.opt;S[k]=!S[k];persist();opt.setAttribute('aria-checked',S[k]);if(k==='shuffle'){const cur=S.order[S.pos];rebuild();}S.flipped=false;render(true);return}
  const ch=t.closest('.chip'); if(ch){S.cat=ch.dataset.cat;persist();rebuild();S.quiz.cur=null;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===ch));renderRows();const cs=ch.parentElement;cs.scrollTo({left:ch.offsetLeft-cs.clientWidth/2+ch.offsetWidth/2,behavior:reduced?'auto':'smooth'});return}
  const rt=t.closest('[data-rate]'); if(rt){fbRate=+rt.dataset.rate;document.querySelectorAll('[data-rate]').forEach(b=>b.setAttribute('aria-pressed',b===rt));SFX.play('tick');return}
  const a=t.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act;
  if(act==='flip') flip();
  else if(act==='know'||act==='learn') mark(act);
  else if(act==='prev'){if(S.pos>0&&!S.busy){SFX.play('tick');S.pos--;S.flipped=false;renderStudy(true)}}
  else if(act==='filter') openSheet(filterHTML());
  else if(act==='close') closeSheet();
  else if(act==='showall'){S.cat='all';S.deck='all';persist();rebuild();render(true)}
  else if(act==='restart'){rebuild();render(true)}
  else if(act==='learnonly'){S.deck='learning';persist();rebuild();render(true)}
  else if(act==='next'){newQuestion();renderQuiz();main.scrollTo({top:0,behavior:reduced?'auto':'smooth'})}
  else if(act==='toggleknown'){const id=a.dataset.id,before=xp();if(S.known.has(id))S.known.delete(id);else S.known.add(id);persist();renderLevel(S.known.has(id));
    a.className='pill '+(S.known.has(id)?'go':'dark');a.innerHTML=S.known.has(id)?I(P.check,20,2.6)+'Known':'Mark as known';
    const st=document.querySelector(`[data-st="${id}"]`);if(st)st.innerHTML=S.known.has(id)?ROSE:I(P.chev,18,2);
    if(S.known.has(id)){const r=a.getBoundingClientRect();burst(r.left+r.width/2,r.top,20,.5)}
    checkBadge(before)}
  else if(act==='studyfrom'){const id=a.dataset.id;S.deck='all';S.order=TERMS.filter(inDeck).map(t=>t.id);if(!S.order.includes(id)){S.cat='all';S.order=TERMS.map(t=>t.id)}S.shuffle=false;persist();S.pos=Math.max(0,S.order.indexOf(id));S.flipped=false;S.first=true;closeSheet();S.tab='study';persist();main.scrollTop=0;render()}
  else if(act==='searchall'){S.cat='all';persist();rebuild();S.quiz.cur=null;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.cat==='all'));$('#chips').scrollTo({left:0});renderRows()}
  else if(act==='feedback'){fbRate=0;openSheet(feedbackHTML(0))}
  else if(act==='sendfb'){sendFeedback()}
  else if(act==='sound'){S.sound=!S.sound;persist();track(S.sound?'sound-on':'sound-off');a.setAttribute('aria-checked',S.sound);if(S.sound)SFX.play('know')}
  else if(act==='askreset'){S.resetAsk=!S.resetAsk;renderHome()}
  else if(act==='noreset'){S.resetAsk=false;renderHome()}
  else if(act==='doreset'){S.known.clear();S.qc=0;S.qa=0;S.best=0;S.seen=-1;S.resetAsk=false;S.quiz={cur:null,opts:[],answered:false,pick:null,score:0,total:0,streak:0,recent:[]};persist();rebuild();renderLevel();renderHome();toast('Progress reset')}
  else if(act==='closeunlock'){const o=document.querySelector('.unlock');if(o)o.remove()}
});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea')||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='Escape'){if(document.querySelector('.unlock'))document.querySelector('.unlock').remove();else if(sheetOpen)closeSheet();return}
  if(sheetOpen||document.querySelector('.unlock')) return;
  if(S.tab==='study'){
    if(e.key===' '||e.key==='Enter'){if(e.target.closest('button'))return;e.preventDefault();flip()}
    else if(e.key==='ArrowRight'){e.preventDefault();mark('know')}
    else if(e.key==='ArrowLeft'){e.preventDefault();mark('learn')}
    else if(e.key==='z'||e.key==='Z'){if(S.pos>0&&!S.busy){S.pos--;S.flipped=false;renderStudy(true)}}
  } else if(S.tab==='quiz'){
    const Q=S.quiz,m={a:1,b:2,c:3,d:4};
    const n=/^[1-4]$/.test(e.key)?+e.key:m[e.key.toLowerCase()];
    if(!Q.answered&&n){pick(Q.opts[n-1])}
    else if(Q.answered&&(e.key==='Enter'||e.key===' '||e.key==='ArrowRight')){e.preventDefault();newQuestion();renderQuiz()}
  }
});


/* desktop panel: QR code for the page's own address (only when hosted somewhere a phone can open) */
if(matchMedia('(min-width:960px)').matches){
  const url=/^https?:$/.test(location.protocol)&&!/claude|usercontent|localhost/.test(location.hostname)?location.origin+location.pathname:null;
  if(url){const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
    sc.onload=()=>{try{const q=qrcode(0,'M');q.addData(url);q.make();const el=$('#qr');el.innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true});el.hidden=false}catch(e){}};
    document.head.appendChild(sc)}
}
/* ---------- boot ---------- */
renderLevel(); rebuild(); render();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{fit();fitTerm()});
let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(fitTerm,120)});
})();
